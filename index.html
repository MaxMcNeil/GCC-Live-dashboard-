<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الخليج المباشر — الرياض · دبي · مسقط · الكويت</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220;
  --panel:#121B2E;
  --panel-2:#0E1626;
  --gold:#C9A24B;
  --live:#E63946;
  --teal:#2FBEA5;
  --sand:#EDE6D6;
  --sand-dim:#9AA3B5;
  --line:rgba(201,162,75,0.18);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{
  width:100%; height:100%; overflow:hidden;
  background:radial-gradient(ellipse at 80% -10%, #16223a 0%, var(--bg) 55%);
  color:var(--sand);
  font-family:'IBM Plex Sans Arabic', sans-serif;
}
.stage{
  width:100vw; height:100vh;
  display:grid;
  grid-template-rows: auto 1fr auto;
  position:relative;
}
.nation-strip{
  position:absolute; left:0; right:0; top:0; height:3px; z-index:2;
  background:linear-gradient(90deg,
    #006C35 0 25%,      /* السعودية */
    #EF3340 25% 50%,    /* الإمارات (لمسة حمراء) */
    #DB161B 50% 75%,    /* عمان */
    #007A3D 75% 100%    /* الكويت */
  );
  opacity:0.65;
}

/* ===== HEADER (مضغوط عمدًا — كل الوضوح مطلوب في المنطقة الرئيسية أسفله) ===== */
header{
  position:relative; z-index:1;
  display:flex; align-items:center; justify-content:space-between;
  padding: 1.2vh 2.2vw;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(201,162,75,0.06), transparent);
}
.brand{ display:flex; align-items:center; gap:1vw; }
.brand .mark{
  width:2.2vh; height:2.2vh; border-radius:50%;
  background:var(--live);
  box-shadow:0 0 1.2vh var(--live);
  animation: pulse 1.4s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes pulse{
  0%,100%{ transform:scale(1); opacity:1;}
  50%{ transform:scale(1.35); opacity:0.55;}
}
.brand h1{
  font-family:'Noto Kufi Arabic', sans-serif;
  font-weight:900;
  font-size: clamp(16px, 2.2vw, 28px);
  color:var(--sand);
}
.brand h1 span{ color:var(--gold); }
.clocks{ display:flex; gap:2vw; font-family:'JetBrains Mono', monospace; align-items:center; }
.clocks div.clockcell{ text-align:center; }
.clocks .flag{ font-size:1.3em; display:block; margin-bottom:2px; }
.clocks .city{ font-size:0.68em; color:var(--sand-dim); letter-spacing:0.02em;}
.clocks .time{ font-size: clamp(13px, 1.4vw, 19px); color:var(--gold); font-weight:600; direction:ltr; }

.sound-toggle{
  width:3.2vh; height:3.2vh; border-radius:50%;
  border:1px solid var(--line); background:rgba(255,255,255,0.03);
  color:var(--gold); font-size:1.4vh; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  margin-inline-start:1.6vw; flex-shrink:0;
  transition:background 0.2s, transform 0.15s;
}
.sound-toggle:hover{ background:rgba(201,162,75,0.12); transform:scale(1.06); }
.sound-toggle.muted{ color:var(--sand-dim); }

/* ===== ZONE PRINCIPALE : un seul contenu géant à la fois =====
   L'ancienne grille à 3 colonnes (listes + chiffres minuscules) est
   remplacée par une seule zone plein écran, avec deux "scènes" empilées
   (actu vedette / statistiques) qui se fondent l'une dans l'autre. */
main{
  position:relative; z-index:1;
  padding: 2vh 3vw;
  min-height:0;
}
#mainStage{ position:relative; width:100%; height:100%; }

.scene{
  position:absolute; inset:0;
  background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border:1px solid var(--line);
  border-radius:16px;
  display:flex; flex-direction:column;
  padding: clamp(16px,3.4vh,40px) clamp(18px,4.4vw,56px);
  transition: opacity 0.5s ease;
}
.scene.hidden{ opacity:0; pointer-events:none; }

/* ---- Scène 1 : actu vedette (une seule à la fois, très grande) ---- */
.hero-tag{
  display:inline-flex; align-self:flex-start;
  background:rgba(201,162,75,0.14); color:var(--gold);
  border:1px solid var(--line); border-radius:999px;
  padding:0.9vh 1.8vw; font-size:clamp(13px,1.5vw,19px); font-weight:700;
  font-family:'Noto Kufi Arabic', sans-serif;
  margin-bottom:clamp(14px,3vh,32px);
}
.hero-body{ flex:1; display:flex; align-items:center; min-height:0; }
.hero-title{
  font-family:'Noto Kufi Arabic', sans-serif;
  font-weight:900;
  font-size: clamp(30px, 6vw, 84px);
  line-height:1.32;
  color:var(--sand);
  transition: opacity 0.3s ease, transform 0.3s ease;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:5; overflow:hidden;
}
.hero-title.long{ font-size:clamp(24px,4.6vw,58px); }
.hero-title.xlong{ font-size:clamp(20px,3.6vw,44px); }
.hero-title.swap{ opacity:0; transform:translateY(12px) scale(0.98); }
.hero-progress{
  margin-top:clamp(14px,3vh,30px);
  height:7px; border-radius:5px; background:rgba(255,255,255,0.07); overflow:hidden;
  flex-shrink:0;
}
.hero-progress-bar{
  height:100%; width:0%; background:linear-gradient(90deg, var(--teal), var(--gold));
  border-radius:5px;
}

/* ---- Scène 2 : statistiques (marchés + météo + vols), affichée
   périodiquement en plein écran avec de très grands chiffres, puis
   effacée pour rendre l'espace à l'actualité ---- */
.stats-header{
  font-family:'Noto Kufi Arabic'; font-weight:800; color:var(--gold);
  font-size:clamp(15px,1.9vw,24px); margin-bottom:clamp(12px,2.4vh,26px);
  display:flex; align-items:center; gap:0.6em;
}
.stats-grid{
  flex:1; min-height:0; overflow:hidden;
  display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr));
  gap:clamp(10px,1.8vh,20px) clamp(10px,1.6vw,20px);
  align-content:center;
}
.stat-big{
  background:rgba(255,255,255,0.04); border:1px solid var(--line); border-radius:14px;
  padding:clamp(10px,2.2vh,22px) clamp(8px,1.4vw,18px); text-align:center;
}
.stat-big .label{ font-size:clamp(11px,1.1vw,15px); color:var(--sand-dim); margin-bottom:0.8vh; }
.stat-big .value{
  font-family:'JetBrains Mono', monospace; font-weight:700;
  font-size:clamp(20px,3.1vw,42px); color:var(--sand); direction:ltr;
}
.stat-big.up .value{ color:var(--teal); }
.stat-big.down .value{ color:var(--live); }

/* ===== BANDEAU DÉFILANT (agrandi, ralenti, contenu enrichi) ===== */
.ticker-wrap{
  position:relative; z-index:1;
  border-top:1px solid var(--line);
  background:linear-gradient(90deg, var(--gold), #8a6d2e);
  overflow:hidden; white-space:nowrap;
  height:7.6vh; display:flex; align-items:center;
}
.ticker-wrap .tag{
  background:var(--bg); color:var(--gold); font-family:'Noto Kufi Arabic';
  font-weight:700; padding:0 1.6vw; height:100%;
  display:flex; align-items:center; gap:0.4em; flex-shrink:0;
  font-size:clamp(14px,1.4vw,19px);
}
.ticker-track{
  display:flex; flex-shrink:0; width:max-content;
  animation: scroll-left 90s linear infinite;
  color:#1a1206; font-weight:700; font-size:clamp(17px,1.75vw,25px);
  padding-inline-start:2vw;
}
.ticker-track span{ margin-inline-end:4.5vw; display:flex; align-items:center; }
.ticker-track span::before{
  content:"●"; font-size:0.4em; margin-inline-end:0.9vw; opacity:0.4; vertical-align:middle;
}
@keyframes scroll-left{
  0%{ transform:translateX(0); }
  100%{ transform:translateX(-50%); }
}

.updated{
  position:fixed; bottom:0.6vh; inset-inline-end:1vw; font-size:10px;
  color:var(--sand-dim); font-family:'JetBrains Mono', monospace; opacity:0.75;
  direction:ltr; display:flex; align-items:center; gap:4px; cursor:default;
}
.health-dot{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--teal); color:var(--teal); box-shadow:0 0 4px currentColor;
  flex-shrink:0;
}
.health-dot.warn{ background:var(--gold); color:var(--gold); }
.health-dot.err{ background:var(--live); color:var(--live); }

/* ===== ORIENTATION (détection auto : portrait 1080x1920 / paysage 1920x1080) =====
   La mise en page à scène unique est déjà "responsive" par nature (clamp() + vw/vh),
   donc peu d'ajustements spécifiques sont nécessaires ici — juste gagner un peu
   de place dans l'en-tête en portrait. */
body.portrait .clocks{ display:none; }
body.portrait header{ padding: 1vh 3vw; }

@media (prefers-reduced-motion: reduce){
  /* بعض إصدارات متصفح OBS المدمج (CEF) تُبلِّغ "reduce" افتراضيًا حتى لو لم
     يطلبه المستخدم فعليًا. لذلك نُبقي على الحركات الوظيفية (الشريط، تبديل
     الأخبار، شريط التقدّم) ونكتفي بإيقاف النبض الزخرفي فقط. */
  .brand .mark{ animation:none !important; }
}
</style>
</head>
<body>
<div class="stage">
  <div class="nation-strip"></div>
  <header>
    <div class="brand">
      <div class="mark"></div>
      <h1>الخليج <span>المباشر</span></h1>
    </div>
    <div style="display:flex; align-items:center;">
      <div class="clocks" id="clocks"></div>
      <button class="sound-toggle" id="soundToggle" title="كتم/تفعيل الأصوات">🔊</button>
    </div>
  </header>

  <main>
    <div id="mainStage">
      <section class="scene" id="heroNews">
        <div class="hero-tag" id="heroTag">الخليج المباشر</div>
        <div class="hero-body">
          <div class="hero-title" id="heroTitle">جارٍ تحميل الأخبار…</div>
        </div>
        <div class="hero-progress"><div class="hero-progress-bar" id="heroProgressBar"></div></div>
      </section>

      <section class="scene hidden" id="statsOverlay">
        <div class="stats-header">📊 تحديث الأسواق والطقس والطيران</div>
        <div class="stats-grid" id="statsGrid"></div>
      </section>
    </div>
  </main>

  <div class="ticker-wrap">
    <div class="tag"><span>●</span> مباشر</div>
    <div class="ticker-track" id="ticker" dir="rtl"><span>جارٍ تحميل الشريط الإخباري…</span></div>
  </div>
</div>
<div class="updated" id="updated"><span class="health-dot" id="healthDot" title="الحالة"></span> <span id="updatedText"></span></div>

<script>
/* ===================== إعداد المدن والأعلام ===================== */
const TZ = {
  "الرياض": { tz:"Asia/Riyadh", flag:"🇸🇦" },
  "دبي":    { tz:"Asia/Dubai",  flag:"🇦🇪" },
  "مسقط":   { tz:"Asia/Muscat", flag:"🇴🇲" },
  "الكويت": { tz:"Asia/Kuwait", flag:"🇰🇼" }
};

// Les clés RSS_FEEDS (fetch_data.py) contiennent déjà un libellé arabe + drapeau
// (ex: "أخبار عُمان 🇴🇲") — donc NEWS_SOURCE_LABELS[source] || source retombe
// naturellement sur un affichage propre sans table de correspondance à maintenir.
const NEWS_SOURCE_LABELS = {};

const WEATHER_CITY_LABELS = {
  "Riyadh":     { name:"الرياض",     flag:"🇸🇦" },
  "Jeddah":     { name:"جدة",        flag:"🇸🇦" },
  "Dubai":      { name:"دبي",        flag:"🇦🇪" },
  "Abu Dhabi":  { name:"أبوظبي",     flag:"🇦🇪" },
  "Muscat":     { name:"مسقط",       flag:"🇴🇲" },
  "Kuwait City":{ name:"مدينة الكويت", flag:"🇰🇼" }
};

const MARKET_LABELS = {
  "USD/SAR": "دولار/ريال سعودي",
  "USD/AED": "دولار/درهم إماراتي",
  "USD/OMR": "دولار/ريال عُماني",
  "USD/KWD": "دولار/دينار كويتي",
  "Brent Crude": "خام برنت",
  "Gold": "الذهب (أونصة)"
};
const CRYPTO_LABELS = { "bitcoin":"بيتكوين", "ethereum":"إيثيريوم" };

const FLIGHT_LABELS = {
  "DXB (Dubai)":  "مطار دبي — DXB",
  "RUH (Riyadh)": "مطار الرياض — RUH",
  "MCT (Muscat)": "مطار مسقط — MCT"
};

/* ===================== نظام الأصوات (بيبات ناعمة) ===================== */
let audioCtx = null;
let soundEnabled = true;
try{ soundEnabled = localStorage.getItem('gcc_sound') !== 'off'; }catch(e){}

function ensureAudio(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    audioCtx = new Ctx();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep({freq=880, duration=0.09, volume=0.045, type='sine', delay=0}={}){
  if(!soundEnabled) return;
  const ctx = ensureAudio();
  if(!ctx) return;
  try{
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }catch(e){}
}

['click','touchstart','keydown'].forEach(evt => {
  window.addEventListener(evt, () => ensureAudio(), { once:true, passive:true });
});

function updateSoundIcon(){
  const btn = document.getElementById('soundToggle');
  btn.textContent = soundEnabled ? '🔊' : '🔇';
  btn.classList.toggle('muted', !soundEnabled);
}
document.getElementById('soundToggle').addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  try{ localStorage.setItem('gcc_sound', soundEnabled ? 'on' : 'off'); }catch(e){}
  updateSoundIcon();
  if(soundEnabled) beep({freq:990, duration:0.08, volume:0.05});
});
updateSoundIcon();

/* ===================== الساعات ===================== */
function renderClocks(){
  const el = document.getElementById('clocks');
  el.innerHTML = Object.entries(TZ).map(([city, info]) => {
    const t = new Date().toLocaleTimeString('ar', {timeZone: info.tz, hour:'2-digit', minute:'2-digit', numberingSystem:'latn'});
    return `<div class="clockcell"><span class="flag">${info.flag}</span><div class="city">${city}</div><div class="time">${t}</div></div>`;
  }).join('');
}
setInterval(renderClocks, 1000);
renderClocks();

function detectOrientation(){
  const w = document.documentElement.clientWidth || window.innerWidth;
  const h = document.documentElement.clientHeight || window.innerHeight;
  document.body.classList.toggle('portrait', h > w);
}
window.addEventListener('resize', detectOrientation);
detectOrientation();
// بعض إصدارات مصدر المتصفح في OBS لا ترسل حدث resize عند الإنشاء،
// لذا نتحقق عدة مرات بعد التحميل لضمان اكتشاف صحيح للأبعاد (أفقي 1920x1080 أو عمودي 1080x1920)
[0, 150, 500, 1500, 3000].forEach(t => setTimeout(detectOrientation, t));
if(window.ResizeObserver){
  new ResizeObserver(detectOrientation).observe(document.documentElement);
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ===================== الخبر الرئيسي (خبر واحد ضخم في كل مرة) =====================
   بدل قائمة صغيرة مزدحمة، نعرض خبرًا واحدًا كبيرًا جدًا، مع بطاقة/شارة المصدر
   وشريط تقدّم يُظهر للمشاهد الوقت المتبقي قبل الانتقال للخبر التالي — ثم
   تلاشٍ ناعم (fade + zoom خفيف) مصحوب ببيب عند كل تبديل. */
let lastNewsHash = '';
let heroItems = [];
let heroIndex = 0;
let heroTimer = null;

function renderNews(news){
  const items = [];
  for(const [source, arr] of Object.entries(news)){
    const label = NEWS_SOURCE_LABELS[source] || source;
    (arr || []).slice(0,6).forEach(item => items.push({ label, title: item.title_ar || item.title }));
  }
  const hash = JSON.stringify(items.map(i => i.title));
  const isNew = hash !== lastNewsHash;
  lastNewsHash = hash;
  if(!isNew) return; // لا نُعيد بناء الدوران أثناء تشغيله لتفادي أي قفزة مرئية

  clearTimeout(heroTimer);
  heroItems = items;
  heroIndex = 0;

  if(!items.length){
    document.getElementById('heroTag').textContent = 'الخليج المباشر';
    document.getElementById('heroTitle').textContent = 'لا توجد بيانات متاحة حالياً.';
    return;
  }
  showHeroItem(0, false);
}

function showHeroItem(idx, animate){
  heroIndex = idx;
  const item = heroItems[idx % heroItems.length];
  const tagEl = document.getElementById('heroTag');
  const titleEl = document.getElementById('heroTitle');
  const barEl = document.getElementById('heroProgressBar');

  const apply = () => {
    tagEl.textContent = item.label;
    titleEl.textContent = item.title;
    titleEl.classList.remove('swap');
    titleEl.classList.toggle('long', item.title.length > 80);
    titleEl.classList.toggle('xlong', item.title.length > 150);
    beep({freq:660, duration:0.07, volume:0.035, type:'sine'});

    // إعادة تشغيل شريط التقدّم من الصفر بالضبط عبر إجبار إعادة الحساب (reflow)
    barEl.style.transition = 'none';
    barEl.style.width = '0%';
    void barEl.offsetWidth;
    const dwell = Math.min(11000, Math.max(5200, 3200 + item.title.length * 42));
    barEl.style.transition = `width ${dwell}ms linear`;
    barEl.style.width = '100%';

    clearTimeout(heroTimer);
    heroTimer = setTimeout(() => {
      showHeroItem((heroIndex + 1) % heroItems.length, true);
    }, dwell);
  };

  if(animate){
    titleEl.classList.add('swap');
    setTimeout(apply, 300);
  } else {
    apply();
  }
}

/* ===================== شاشة الإحصاءات الدورية =====================
   بدل عرض الطقس وأسعار الصرف بشكل دائم (وهو ما كان يُصغّر كل شيء)،
   نُظهرها كل 5 دقائق لمدة 30 ثانية فقط بأرقام كبيرة جدًا، ثم نمحوها
   لإعادة كل المساحة للخبر الرئيسي. */
const STATS_INTERVAL_MS = 5 * 60 * 1000;
const STATS_DURATION_MS = 30 * 1000;
const STATS_FIRST_DELAY_MS = 40 * 1000;
let lastStatsData = null;

function statBig(label, value, cls){
  return `<div class="stat-big ${cls||''}"><div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(String(value))}</div></div>`;
}

function renderStats(data){
  lastStatsData = data;
  const el = document.getElementById('statsGrid');
  let html = '';
  const markets = data.markets || {};
  for(const [label, val] of Object.entries(markets)){
    if(label === 'crypto'){
      for(const [coin, prices] of Object.entries(val || {})){
        html += statBig(CRYPTO_LABELS[coin] || coin, '$' + (prices.usd||0).toLocaleString('en-US'));
      }
    } else {
      html += statBig(MARKET_LABELS[label] || label, val);
    }
  }
  for(const [city, w] of Object.entries(data.weather || {})){
    if(w.temperature_2m === undefined) continue;
    const info = WEATHER_CITY_LABELS[city] || { name:city, flag:'' };
    html += statBig(`${info.flag} ${info.name}`, Math.round(w.temperature_2m) + '°C');
  }
  for(const [ap, count] of Object.entries(data.flights || {})){
    html += statBig(FLIGHT_LABELS[ap] || ap, count + ' رحلة');
  }
  el.innerHTML = html || statBig('لا توجد بيانات', '—');
}

function showStatsOverlay(){
  clearTimeout(heroTimer);
  document.getElementById('heroNews').classList.add('hidden');
  document.getElementById('statsOverlay').classList.remove('hidden');
  beep({freq:988, duration:0.1, volume:0.04});
  beep({freq:1318, duration:0.1, volume:0.035, delay:0.1});
}
function hideStatsOverlay(){
  document.getElementById('statsOverlay').classList.add('hidden');
  document.getElementById('heroNews').classList.remove('hidden');
  if(heroItems.length) showHeroItem((heroIndex + 1) % heroItems.length, true);
}
setTimeout(() => {
  showStatsOverlay();
  setTimeout(hideStatsOverlay, STATS_DURATION_MS);
  setInterval(() => {
    showStatsOverlay();
    setTimeout(hideStatsOverlay, STATS_DURATION_MS);
  }, STATS_INTERVAL_MS);
}, STATS_FIRST_DELAY_MS);

/* ===================== البانر السفلي (دوران أبدي حقيقي، بلا اعتماد على قياس عرض الخط) =====================
   الإصدار السابق كان يحسب مدة الحركة من scrollWidth الفعلي للعنصر مباشرة
   بعد تغيير innerHTML — وهذا القياس قد يقع قبل اكتمال تحميل خط عربي مخصص
   (Noto Kufi / IBM Plex Sans Arabic)، فيُنتج مدة خاطئة تمامًا (شبه صفرية
   أو ضخمة جدًا) وتُعطي إحساسًا بأن الشريط "يمر مرة واحدة ثم يتجمّد فارغًا".
   الحل: نحسب المدة من عدد الأحرف مباشرة (رقم ثابت لا يعتمد على الخط أو
   إعادة التخطيط)، فتبقى دائمًا صحيحة ومضمونة الاستمرارية. */
let lastTickerHash = '';

function buildTickerSegments(data){
  const segs = [];
  let n = 0;
  for(const [source, arr] of Object.entries(data.news || {})){
    (arr||[]).slice(0,3).forEach(i => {
      segs.push((n < 2 ? '🔴 عاجل — ' : '📰 ') + (i.title_ar || i.title));
      n++;
    });
  }
  for(const [label, val] of Object.entries(data.markets || {})){
    if(label === 'crypto'){
      for(const [coin, p] of Object.entries(val || {})){
        segs.push(`💰 ${CRYPTO_LABELS[coin] || coin}: $${(p.usd||0).toLocaleString('en-US')}`);
      }
    } else {
      segs.push(`💹 ${MARKET_LABELS[label] || label}: ${val}`);
    }
  }
  for(const [city, w] of Object.entries(data.weather || {})){
    if(w.temperature_2m === undefined) continue;
    const info = WEATHER_CITY_LABELS[city] || { name:city, flag:'' };
    segs.push(`${info.flag} ${info.name}: ${Math.round(w.temperature_2m)}°م`);
  }
  for(const [ap, count] of Object.entries(data.flights || {})){
    segs.push(`✈️ ${FLIGHT_LABELS[ap] || ap}: ${count} رحلة نشطة`);
  }
  return segs;
}

function renderTicker(data){
  const parts = buildTickerSegments(data);
  const track = document.getElementById('ticker');
  const hash = JSON.stringify(parts);
  const isNew = hash !== lastTickerHash;
  lastTickerHash = hash;
  if(!isNew) return;

  const content = parts.map(p => `<span>${escapeHtml(p)}</span>`).join('');

  // عدد الأحرف الإجمالي هو أساس حساب مدة الحركة (وتيرة هادئة وثابتة،
  // لا تتسارع أبدًا مهما زاد عدد الأخبار — هذا ما يحقّق "غير سريع جدًا")
  const totalChars = parts.join('').length;
  const duration = Math.min(260, Math.max(65, totalChars * 0.32));

  track.style.animation = 'none';
  track.innerHTML = content + content; // مكرر لضمان استمرارية الدوران الأبدي
  void track.offsetWidth; // إجبار إعادة الرسم قبل إعادة تفعيل الحركة (تقنية إعادة التشغيل القياسية)
  track.style.animation = `scroll-left ${duration.toFixed(1)}s linear infinite`;

  beep({freq:880, duration:0.09, volume:0.035});
  beep({freq:1175, duration:0.09, volume:0.03, delay:0.09});
}

/* ===================== تحميل البيانات ===================== */
async function loadData(){
  try{
    const res = await fetch('data.json?_=' + Date.now());
    const data = await res.json();
    renderNews(data.news || {});
    renderStats(data);
    renderTicker(data);
    document.getElementById('updatedText').textContent =
      'آخر تحديث: ' + new Intl.DateTimeFormat('ar', {numberingSystem:'latn', dateStyle:'short', timeStyle:'medium'}).format(new Date(data.generated_at_utc));
    renderHealth(data._meta);
  }catch(e){
    console.error('تعذّر تحميل data.json', e);
    const dot = document.getElementById('healthDot');
    dot.className = 'health-dot err';
    dot.title = 'تعذّر تحميل data.json في المتصفح: ' + e.message;
  }
}

function renderHealth(meta){
  const dot = document.getElementById('healthDot');
  if(!meta){ dot.className = 'health-dot'; dot.title = 'لا توجد معلومات تشخيصية'; return; }
  const errors = meta.errors || [];
  if(errors.length === 0){
    dot.className = 'health-dot';
    dot.title = 'كل المصادر تعمل بشكل طبيعي ✅';
  } else {
    const failedSources = Object.entries(meta.status || {}).filter(([,ok]) => !ok).map(([s]) => s);
    const allDown = failedSources.length > 0 && Object.values(meta.status || {}).every(v => !v);
    dot.className = 'health-dot ' + (allDown ? 'err' : 'warn');
    dot.title = 'مصادر متعطلة: ' + errors.map(e => `${e.source} (${e.stage}): ${e.error}`).join(' | ');
  }
}

loadData();
// المصدر (fetch_data.py) لا يتحدّث إلا كل 5 ساعات عبر GitHub Actions،
// فحص كل 5 دقائق من جهة المتصفح يكفي لالتقاط أي تحديث بسرعة دون طلبات زائدة
setInterval(loadData, 5 * 60 * 1000);
</script>
