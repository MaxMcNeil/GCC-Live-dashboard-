<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الخليج المباشر — الرياض · دبي · مسقط · الكويت</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220;
  --panel:#121B2E;
  --panel-2:#0E1626;
  --gold:#C9A24B;
  --live:#E63946;
  --teal:#2FBEA5;
  --sand:#EDE6D6;
  --sand-dim:#9AA3B5;
  --line:rgba(201,162,75,0.18);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{
  width:100%; height:100%; overflow:hidden;
  background:radial-gradient(ellipse at 80% -10%, #16223a 0%, var(--bg) 55%);
  color:var(--sand);
  font-family:'IBM Plex Sans Arabic', sans-serif;
}
.stage{
  width:100vw; height:100vh;
  display:grid;
  grid-template-rows: auto 1fr auto;
  position:relative;
}
.nation-strip{
  position:absolute; left:0; right:0; top:0; height:3px; z-index:2;
  background:linear-gradient(90deg,
    #006C35 0 25%, #EF3340 25% 50%, #DB161B 50% 75%, #007A3D 75% 100%);
  opacity:0.65;
}

/* ===== HEADER ===== */
header{
  position:relative; z-index:1;
  display:flex; align-items:center; justify-content:space-between;
  padding: 1.6vh 2.2vw;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(201,162,75,0.06), transparent);
}
.brand{ display:flex; align-items:center; gap:1vw; }
.brand .mark{
  width:2.2vh; height:2.2vh; border-radius:50%;
  background:var(--live); box-shadow:0 0 1.2vh var(--live);
  animation: pulse 1.4s ease-in-out infinite; flex-shrink:0;
}
@keyframes pulse{ 0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.35); opacity:0.55;} }
.brand h1{
  font-family:'Noto Kufi Arabic', sans-serif; font-weight:900;
  font-size: clamp(16px, 2.2vw, 28px); color:var(--sand);
}
.brand h1 span{ color:var(--gold); }

/* الساعات: مكبَّرة بوضوح — كانت غير مقروءة سابقًا */
.clocks{ display:flex; gap:1.8vw; font-family:'JetBrains Mono', monospace; align-items:center; }
.clocks div.clockcell{ text-align:center; }
.clocks .flag{ font-size:1.5em; display:block; margin-bottom:2px; }
.clocks .city{ font-size:clamp(11px,1.15vw,15px); color:var(--sand-dim); letter-spacing:0.02em; font-weight:600; }
.clocks .time{ font-size: clamp(20px, 2.6vw, 34px); color:var(--gold); font-weight:700; direction:ltr; }

.sound-toggle{
  width:3.2vh; height:3.2vh; border-radius:50%;
  border:1px solid var(--line); background:rgba(255,255,255,0.03);
  color:var(--gold); font-size:1.4vh; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  margin-inline-start:1.6vw; flex-shrink:0;
  transition:background 0.2s, transform 0.15s;
}
.sound-toggle:hover{ background:rgba(201,162,75,0.12); transform:scale(1.06); }
.sound-toggle.muted{ color:var(--sand-dim); }

/* ===== ZONE PRINCIPALE : une seule actu géante ===== */
main{ position:relative; z-index:1; padding: 2vh 3vw; min-height:0; display:flex; }
#mainStage{ position:relative; flex:1; min-height:0; display:flex; }

.hero-card{
  flex:1; min-height:0; position:relative;
  background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border:1px solid var(--line); border-radius:16px;
  display:flex; flex-direction:column;
  padding: clamp(16px,3.4vh,40px) clamp(18px,4.4vw,56px);
}
.hero-body{ flex:1; display:flex; align-items:center; min-height:0; }
.hero-title{
  font-family:'Noto Kufi Arabic', sans-serif; font-weight:900;
  font-size: clamp(30px, 6vw, 84px); line-height:1.32; color:var(--sand);
  transition: opacity 0.3s ease, transform 0.3s ease;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:5; overflow:hidden;
}
.hero-title.long{ font-size:clamp(24px,4.6vw,58px); }
.hero-title.xlong{ font-size:clamp(20px,3.6vw,44px); }
.hero-title.swap{ opacity:0; transform:translateY(12px) scale(0.98); }

/* المصدر أصبح أسفل الخبر (وليس ملتصقًا بنهاية النص)، بخط مختلف وأصغر عمدًا
   عن العنوان الرئيسي حتى لا يُنافسه، مع الأعلام بشكل فني بارز بجانبه */
.hero-footer{
  display:flex; align-items:center; gap:1.1vw; flex-wrap:wrap;
  margin-top:clamp(10px,2vh,20px); padding-top:clamp(8px,1.6vh,16px);
  border-top:1px dashed var(--line); flex-shrink:0;
}
.hero-flags{ display:flex; gap:0.5vw; flex-shrink:0; }
.flag-chip{
  display:inline-flex; align-items:center; justify-content:center;
  font-size:clamp(20px,2.8vw,36px);
  background:rgba(255,255,255,0.05);
  border:1px solid var(--line); border-radius:10px;
  padding:0.25em 0.45em;
  filter:drop-shadow(0 0 6px rgba(201,162,75,0.35));
  animation: flagPop 0.45s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes flagPop{ from{ transform:scale(0.55); opacity:0;} to{ transform:scale(1); opacity:1;} }
.hero-source{
  display:inline-flex; align-items:center;
  font-family:'IBM Plex Sans Arabic', sans-serif; font-weight:700;
  color:var(--bg); background:var(--teal);
  padding:0.45em 1em; border-radius:8px;
  font-size:clamp(14px,1.6vw,21px); letter-spacing:0.01em;
}

.hero-progress{
  margin-top:clamp(12px,2.4vh,24px); height:7px; border-radius:5px;
  background:rgba(255,255,255,0.07); overflow:hidden; flex-shrink:0;
}
.hero-progress-bar{
  height:100%; width:0%;
  background:linear-gradient(90deg, var(--teal), var(--gold)); border-radius:5px;
}

/* ===== PASTILLE FLOTTANTE : marchés / météo / vols en boucle perpétuelle =====
   Remplace l'ancien plein-écran périodique (jugé "moche"/envahissant) par un
   petit encart artistique en coin, toujours discret, qui balaie les données
   une par une, à l'infini, sans jamais gêner la lecture de l'actu géante. */
.stat-pop{
  position:absolute; top:clamp(10px,2vh,22px); inset-inline-end:clamp(10px,2vw,26px);
  z-index:5; max-width:46vw;
  display:flex; align-items:center; gap:0.7em;
  background:rgba(18,27,46,0.74); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border:1px solid var(--line); border-radius:14px;
  padding:0.9vh 1.3vw;
  box-shadow:0 6px 20px rgba(0,0,0,0.35), 0 0 0 1px rgba(201,162,75,0.08);
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.stat-pop.swap{ opacity:0; transform:translateY(-8px) scale(0.95); }
.stat-pop-icon{ font-size:clamp(18px,2.1vw,30px); flex-shrink:0; filter:drop-shadow(0 0 4px rgba(201,162,75,0.4)); }
.stat-pop-body{ min-width:0; }
.stat-pop-label{ font-size:clamp(10px,1.05vw,14px); color:var(--sand-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stat-pop-value{
  font-family:'JetBrains Mono', monospace; font-weight:700;
  font-size:clamp(16px,1.9vw,26px); color:var(--gold); direction:ltr;
}

/* ===== BANDEAU DÉFILANT (boucle pilotée en JS — voir plus bas) ===== */
.ticker-wrap{
  position:relative; z-index:1;
  border-top:1px solid var(--line);
  background:linear-gradient(90deg, var(--gold), #8a6d2e);
  overflow:hidden; white-space:nowrap;
  height:7.6vh; display:flex; align-items:center;
}
.ticker-wrap .tag{
  background:var(--bg); color:var(--gold); font-family:'Noto Kufi Arabic';
  font-weight:700; padding:0 1.6vw; height:100%;
  display:flex; align-items:center; gap:0.4em; flex-shrink:0;
  font-size:clamp(14px,1.4vw,19px);
}
.ticker-track{
  display:flex; flex-shrink:0; width:max-content; will-change:transform;
  color:#1a1206; font-weight:700; font-size:clamp(17px,1.75vw,25px);
  padding-inline-start:2vw;
}
.ticker-track span{ margin-inline-end:4.5vw; display:flex; align-items:center; }
.ticker-track span::before{
  content:"●"; font-size:0.4em; margin-inline-end:0.9vw; opacity:0.4; vertical-align:middle;
}

.updated{
  position:fixed; bottom:0.6vh; inset-inline-end:1vw; font-size:10px;
  color:var(--sand-dim); font-family:'JetBrains Mono', monospace; opacity:0.75;
  direction:ltr; display:flex; align-items:center; gap:4px; cursor:default;
}
.health-dot{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--teal); color:var(--teal); box-shadow:0 0 4px currentColor; flex-shrink:0;
}
.health-dot.warn{ background:var(--gold); color:var(--gold); }
.health-dot.err{ background:var(--live); color:var(--live); }

body.portrait .clocks{ display:none; }
body.portrait header{ padding: 1.2vh 3vw; }
body.portrait .stat-pop{ max-width:70vw; }

@media (prefers-reduced-motion: reduce){
  /* بعض إصدارات متصفح OBS المدمج (CEF) تُبلِّغ "reduce" افتراضيًا حتى لو لم
     يطلبه المستخدم فعليًا، لذا نُبقي كل الحركات الوظيفية ونعطّل فقط النبض الزخرفي. */
  .brand .mark{ animation:none !important; }
}
</style>
</head>
<body>
<div class="stage">
  <div class="nation-strip"></div>
  <header>
    <div class="brand">
      <div class="mark"></div>
      <h1>الخليج <span>المباشر</span></h1>
    </div>
    <div style="display:flex; align-items:center;">
      <div class="clocks" id="clocks"></div>
      <button class="sound-toggle" id="soundToggle" title="كتم/تفعيل الأصوات">🔊</button>
    </div>
  </header>

  <main>
    <div id="mainStage">
      <section class="hero-card">
        <div class="hero-body">
          <div class="hero-title" id="heroTitle">جارٍ تحميل الأخبار…</div>
        </div>
        <div class="hero-footer">
          <div class="hero-flags" id="heroFlags"></div>
          <div class="hero-source" id="heroSource"></div>
        </div>
        <div class="hero-progress"><div class="hero-progress-bar" id="heroProgressBar"></div></div>
      </section>

      <div class="stat-pop" id="statPop">
        <div class="stat-pop-icon" id="statPopIcon">💹</div>
        <div class="stat-pop-body">
          <div class="stat-pop-label" id="statPopLabel">—</div>
          <div class="stat-pop-value" id="statPopValue">—</div>
        </div>
      </div>
    </div>
  </main>

  <div class="ticker-wrap">
    <div class="tag"><span>●</span> مباشر</div>
    <div class="ticker-track" id="ticker" dir="rtl"><span>جارٍ تحميل الشريط الإخباري…</span></div>
  </div>
</div>
<div class="updated" id="updated"><span class="health-dot" id="healthDot" title="الحالة"></span> <span id="updatedText"></span></div>

<script>
/* ===================== إعداد المدن والأعلام ===================== */
const TZ = {
  "الرياض": { tz:"Asia/Riyadh", flag:"🇸🇦" },
  "دبي":    { tz:"Asia/Dubai",  flag:"🇦🇪" },
  "مسقط":   { tz:"Asia/Muscat", flag:"🇴🇲" },
  "الكويت": { tz:"Asia/Kuwait", flag:"🇰🇼" }
};

// Les clés RSS_FEEDS (fetch_data.py) contiennent déjà un libellé arabe + drapeau
// (ex: "أخبار عُمان 🇴🇲") — on extrait ce drapeau par regex, et on complète en
// scannant le titre pour d'autres pays du Golfe explicitement mentionnés.
const NEWS_SOURCE_LABELS = {};
const GULF_KEYWORDS = [
  { flag:'🇸🇦', words:['السعودية','سعودي','الرياض','جدة','مكة','المدينة المنورة'] },
  { flag:'🇦🇪', words:['الإمارات','إماراتي','دبي','أبوظبي','أبو ظبي','الشارقة'] },
  { flag:'🇴🇲', words:['عُمان','عمان','عماني','مسقط'] },
  { flag:'🇰🇼', words:['الكويت','كويتي'] }
];
function extractFlagEmoji(str){
  return (str||'').match(/[\u{1F1E6}-\u{1F1FF}]{2}/gu) || [];
}
function resolveFlags(label, title){
  const set = new Set(extractFlagEmoji(label));
  GULF_KEYWORDS.forEach(k => { if(k.words.some(w => (title||'').includes(w))) set.add(k.flag); });
  if(set.size === 0) set.add('🌐');
  return Array.from(set);
}
function cleanSourceLabel(label){
  return (label||'').replace(/[\u{1F1E6}-\u{1F1FF}]{2}/gu,'').trim();
}

const WEATHER_CITY_LABELS = {
  "Riyadh":     { name:"الرياض",     flag:"🇸🇦" },
  "Jeddah":     { name:"جدة",        flag:"🇸🇦" },
  "Dubai":      { name:"دبي",        flag:"🇦🇪" },
  "Abu Dhabi":  { name:"أبوظبي",     flag:"🇦🇪" },
  "Muscat":     { name:"مسقط",       flag:"🇴🇲" },
  "Kuwait City":{ name:"مدينة الكويت", flag:"🇰🇼" }
};
const MARKET_LABELS = {
  "USD/SAR": "دولار/ريال سعودي", "USD/AED": "دولار/درهم إماراتي",
  "USD/OMR": "دولار/ريال عُماني", "USD/KWD": "دولار/دينار كويتي",
  "Brent Crude": "خام برنت", "Gold": "الذهب (أونصة)"
};
const CRYPTO_LABELS = { "bitcoin":"بيتكوين", "ethereum":"إيثيريوم" };
const FLIGHT_LABELS = {
  "DXB (Dubai)":  "مطار دبي — DXB", "RUH (Riyadh)": "مطار الرياض — RUH", "MCT (Muscat)": "مطار مسقط — MCT"
};

/* ===================== نظام الأصوات ===================== */
let audioCtx = null;
let soundEnabled = true;
try{ soundEnabled = localStorage.getItem('gcc_sound') !== 'off'; }catch(e){}
function ensureAudio(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    audioCtx = new Ctx();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function beep({freq=880, duration=0.09, volume=0.045, type='sine', delay=0}={}){
  if(!soundEnabled) return;
  const ctx = ensureAudio();
  if(!ctx) return;
  try{
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + duration + 0.02);
  }catch(e){}
}
['click','touchstart','keydown'].forEach(evt => {
  window.addEventListener(evt, () => ensureAudio(), { once:true, passive:true });
});
function updateSoundIcon(){
  const btn = document.getElementById('soundToggle');
  btn.textContent = soundEnabled ? '🔊' : '🔇';
  btn.classList.toggle('muted', !soundEnabled);
}
document.getElementById('soundToggle').addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  try{ localStorage.setItem('gcc_sound', soundEnabled ? 'on' : 'off'); }catch(e){}
  updateSoundIcon();
  if(soundEnabled) beep({freq:990, duration:0.08, volume:0.05});
});
updateSoundIcon();

/* ===================== الساعات ===================== */
function renderClocks(){
  const el = document.getElementById('clocks');
  el.innerHTML = Object.entries(TZ).map(([city, info]) => {
    const t = new Date().toLocaleTimeString('ar', {timeZone: info.tz, hour:'2-digit', minute:'2-digit', numberingSystem:'latn'});
    return `<div class="clockcell"><span class="flag">${info.flag}</span><div class="city">${city}</div><div class="time">${t}</div></div>`;
  }).join('');
}
setInterval(renderClocks, 1000);
renderClocks();

function detectOrientation(){
  const w = document.documentElement.clientWidth || window.innerWidth;
  const h = document.documentElement.clientHeight || window.innerHeight;
  document.body.classList.toggle('portrait', h > w);
}
window.addEventListener('resize', detectOrientation);
detectOrientation();
[0, 150, 500, 1500, 3000].forEach(t => setTimeout(detectOrientation, t));
if(window.ResizeObserver){ new ResizeObserver(detectOrientation).observe(document.documentElement); }

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ===================== الخبر الرئيسي (خبر واحد ضخم، مصدر وأعلام أسفله) ===================== */
let lastNewsHash = '';
let heroItems = [];
let heroIndex = 0;
let heroTimer = null;

function renderNews(news){
  const items = [];
  for(const [source, arr] of Object.entries(news)){
    const label = NEWS_SOURCE_LABELS[source] || source;
    (arr || []).slice(0,6).forEach(item => items.push({ label, title: item.title_ar || item.title }));
  }
  const hash = JSON.stringify(items.map(i => i.title));
  const isNew = hash !== lastNewsHash;
  lastNewsHash = hash;
  if(!isNew) return;

  clearTimeout(heroTimer);
  heroItems = items;
  heroIndex = 0;

  if(!items.length){
    document.getElementById('heroTitle').textContent = 'لا توجد بيانات متاحة حالياً.';
    document.getElementById('heroSource').textContent = '';
    document.getElementById('heroFlags').innerHTML = '';
    return;
  }
  showHeroItem(0, false);
}

function showHeroItem(idx, animate){
  heroIndex = idx;
  const item = heroItems[idx % heroItems.length];
  const titleEl = document.getElementById('heroTitle');
  const sourceEl = document.getElementById('heroSource');
  const flagsEl = document.getElementById('heroFlags');
  const barEl = document.getElementById('heroProgressBar');

  const apply = () => {
    titleEl.textContent = item.title;
    titleEl.classList.remove('swap');
    titleEl.classList.toggle('long', item.title.length > 80);
    titleEl.classList.toggle('xlong', item.title.length > 150);

    sourceEl.textContent = cleanSourceLabel(item.label);
    const flags = resolveFlags(item.label, item.title);
    flagsEl.innerHTML = flags.map(f => `<span class="flag-chip">${f}</span>`).join('');

    beep({freq:660, duration:0.07, volume:0.035, type:'sine'});

    barEl.style.transition = 'none';
    barEl.style.width = '0%';
    void barEl.offsetWidth;
    const dwell = Math.min(11000, Math.max(5200, 3200 + item.title.length * 42));
    barEl.style.transition = `width ${dwell}ms linear`;
    barEl.style.width = '100%';

    clearTimeout(heroTimer);
    heroTimer = setTimeout(() => { showHeroItem((heroIndex + 1) % heroItems.length, true); }, dwell);
  };

  if(animate){
    titleEl.classList.add('swap');
    setTimeout(apply, 300);
  } else {
    apply();
  }
}

/* ===================== الپاستيلة العائمة (أسواق/طقس/طيران في حلقة أبدية) =====================
   بدل الشاشة الكاملة الدورية (نتائج سيئة بصريًا)، عنصر فني صغير في الزاوية
   يستعرض القيم واحدة تلو الأخرى، بلا توقف أبدًا، ببيب خفيف عند كل تبديل. */
let popItems = [];
let popIndex = 0;
let popTimer = null;
let lastStatsHash = '';

function buildPopItems(data){
  const items = [];
  for(const [label, val] of Object.entries(data.markets || {})){
    if(label === 'crypto'){
      for(const [coin, p] of Object.entries(val || {})){
        items.push({ icon:'💰', label:CRYPTO_LABELS[coin] || coin, value:'$' + (p.usd||0).toLocaleString('en-US') });
      }
    } else {
      items.push({ icon:'💹', label:MARKET_LABELS[label] || label, value:String(val) });
    }
  }
  for(const [city, w] of Object.entries(data.weather || {})){
    if(w.temperature_2m === undefined) continue;
    const info = WEATHER_CITY_LABELS[city] || { name:city, flag:'🌡️' };
    items.push({ icon:info.flag || '🌡️', label:info.name, value:Math.round(w.temperature_2m) + '°C' });
  }
  for(const [ap, count] of Object.entries(data.flights || {})){
    items.push({ icon:'✈️', label:FLIGHT_LABELS[ap] || ap, value:count + ' رحلة' });
  }
  return items;
}

function renderStats(data){
  const items = buildPopItems(data);
  popItems = items; // القيم تتحدّث دائمًا؛ الدوران نفسه لا يُعاد تشغيله إلا مرّة واحدة عند البداية
  const hash = JSON.stringify(items);
  if(hash === lastStatsHash) return;
  lastStatsHash = hash;
  if(!popTimer && items.length) showPopItem(0);
}

function showPopItem(idx){
  if(!popItems.length) return;
  popIndex = idx % popItems.length;
  const item = popItems[popIndex];
  const card = document.getElementById('statPop');
  const apply = () => {
    document.getElementById('statPopIcon').textContent = item.icon;
    document.getElementById('statPopLabel').textContent = item.label;
    document.getElementById('statPopValue').textContent = item.value;
    card.classList.remove('swap');
    beep({freq:1046, duration:0.06, volume:0.03, type:'triangle'}); // بيب أبدي خفيف مع كل تبديل
    clearTimeout(popTimer);
    popTimer = setTimeout(() => showPopItem(popIndex + 1), 4500);
  };
  card.classList.add('swap');
  setTimeout(apply, 250);
}

/* ===================== البانر السفلي — دوران أبدي حقيقي مُدار بالكامل عبر JS =====================
   السبب الجذري للعطل السابق ("يمر مرة واحدة ثم يبقى فارغًا/متجمّدًا"): الاعتماد
   على حركة CSS بمعدل @keyframes + animation-iteration-count:infinite. بعض
   إصدارات متصفح OBS المدمج (CEF، وضع العرض خارج الشاشة) لا يُعيد رسم/تحديث
   حركات CSS الخاملة بشكل موثوق بعد اكتمال دورة واحدة. الحل القاطع: نتخلى
   تمامًا عن حركة CSS وندفع الموضع يدويًا كل إطار عبر requestAnimationFrame —
   هذا يُجبر المتصفح على إعادة الرسم في كل إطار ولا يمكن أن "يتجمّد" أبدًا،
   وهي الطريقة المعروفة لتفادي هذا العطل تحديدًا داخل مصادر متصفح OBS. */
let lastTickerHash = '';
let tickerOffset = 0;
let tickerHalfWidth = 0;
let tickerLastTs = null;
const TICKER_PX_PER_SEC = 58; // وتيرة قراءة مريحة وثابتة، لا تتسارع أبدًا مهما زاد المحتوى

function buildTickerSegments(data){
  const segs = [];
  let n = 0;
  for(const [source, arr] of Object.entries(data.news || {})){
    (arr||[]).slice(0,3).forEach(i => {
      segs.push((n < 2 ? '🔴 عاجل — ' : '📰 ') + (i.title_ar || i.title));
      n++;
    });
  }
  for(const [label, val] of Object.entries(data.markets || {})){
    if(label === 'crypto'){
      for(const [coin, p] of Object.entries(val || {})){
        segs.push(`💰 ${CRYPTO_LABELS[coin] || coin}: $${(p.usd||0).toLocaleString('en-US')}`);
      }
    } else {
      segs.push(`💹 ${MARKET_LABELS[label] || label}: ${val}`);
    }
  }
  for(const [city, w] of Object.entries(data.weather || {})){
    if(w.temperature_2m === undefined) continue;
    const info = WEATHER_CITY_LABELS[city] || { name:city, flag:'' };
    segs.push(`${info.flag} ${info.name}: ${Math.round(w.temperature_2m)}°م`);
  }
  for(const [ap, count] of Object.entries(data.flights || {})){
    segs.push(`✈️ ${FLIGHT_LABELS[ap] || ap}: ${count} رحلة نشطة`);
  }
  return segs;
}

function renderTicker(data){
  const parts = buildTickerSegments(data);
  const track = document.getElementById('ticker');
  const hash = JSON.stringify(parts);
  const isNew = hash !== lastTickerHash;
  lastTickerHash = hash;
  if(!isNew) return;

  const content = parts.map(p => `<span>${escapeHtml(p)}</span>`).join('');
  track.innerHTML = content + content; // مكرر لضمان دوران بصري سلس
  tickerHalfWidth = track.scrollWidth / 2;
  tickerOffset = 0;
  track.style.transform = 'translateX(0px)';
}

function tickerFrame(ts){
  if(tickerLastTs === null) tickerLastTs = ts;
  let dt = (ts - tickerLastTs) / 1000;
  tickerLastTs = ts;
  // السبب الحقيقي للعطل: عند قفل الشاشة أو تبديل مشهد OBS ثم العودة، يتوقف
  // الرسم لفترة، وعند الاستئناف يكون الفارق الزمني بين الإطارين ضخمًا (قد
  // يبلغ دقائق) — هذا يدفع الشريط آلاف البكسلات خارج الشاشة دفعة واحدة ولا
  // يتعافى بمنطق "إضافة واحدة فقط". الحل: تحديد سقف للفارق الزمني لكل إطار.
  if(dt > 0.25) dt = 0.25;
  if(tickerHalfWidth > 0){
    tickerOffset -= TICKER_PX_PER_SEC * dt;
    while(tickerOffset <= -tickerHalfWidth) tickerOffset += tickerHalfWidth; // تعافٍ كامل ومضمون مهما كانت القفزة
    document.getElementById('ticker').style.transform = `translateX(${tickerOffset}px)`;
  }
  requestAnimationFrame(tickerFrame);
}
requestAnimationFrame(tickerFrame);
// بيب أبدي خفيف كل ~9 ثوانٍ لمرافقة حركة الشريط بلا اعتماد على أي حدث CSS
setInterval(() => beep({freq:1046, duration:0.06, volume:0.025, type:'triangle'}), 9000);

/* ===================== تحميل البيانات ===================== */
async function loadData(){
  try{
    const res = await fetch('data.json?_=' + Date.now());
    const data = await res.json();
    renderNews(data.news || {});
    renderStats(data);
    renderTicker(data);
    document.getElementById('updatedText').textContent =
      'آخر تحديث: ' + new Intl.DateTimeFormat('ar', {numberingSystem:'latn', dateStyle:'short', timeStyle:'medium'}).format(new Date(data.generated_at_utc));
    renderHealth(data._meta);
  }catch(e){
    console.error('تعذّر تحميل data.json', e);
    const dot = document.getElementById('healthDot');
    dot.className = 'health-dot err';
    dot.title = 'تعذّر تحميل data.json في المتصفح: ' + e.message;
  }
}

function renderHealth(meta){
  const dot = document.getElementById('healthDot');
  if(!meta){ dot.className = 'health-dot'; dot.title = 'لا توجد معلومات تشخيصية'; return; }
  const errors = meta.errors || [];
  if(errors.length === 0){
    dot.className = 'health-dot';
    dot.title = 'كل المصادر تعمل بشكل طبيعي ✅';
  } else {
    const failedSources = Object.entries(meta.status || {}).filter(([,ok]) => !ok).map(([s]) => s);
    const allDown = failedSources.length > 0 && Object.values(meta.status || {}).every(v => !v);
    dot.className = 'health-dot ' + (allDown ? 'err' : 'warn');
    dot.title = 'مصادر متعطلة: ' + errors.map(e => `${e.source} (${e.stage}): ${e.error}`).join(' | ');
  }
}

loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
