<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الخليج المباشر — الرياض · دبي · مسقط · الكويت</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220;
  --panel:#121B2E;
  --panel-2:#0E1626;
  --gold:#C9A24B;
  --live:#E63946;
  --teal:#2FBEA5;
  --sand:#EDE6D6;
  --sand-dim:#9AA3B5;
  --line:rgba(201,162,75,0.18);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{
  width:100%; height:100%; overflow:hidden;
  background:radial-gradient(ellipse at 80% -10%, #16223a 0%, var(--bg) 55%);
  color:var(--sand);
  font-family:'IBM Plex Sans Arabic', sans-serif;
}
.stage{
  width:100vw; height:100vh;
  display:grid;
  grid-template-rows: auto 1fr auto;
  position:relative;
}

/* ===== FLAG WATERMARK (decorative only, sits behind header text, never over data) ===== */
.flag-band{
  position:absolute; inset:0 0 auto 0; height:9vh;
  display:flex; align-items:center; justify-content:space-evenly;
  font-size:6vh; opacity:0.05; filter:saturate(0.7);
  pointer-events:none; z-index:0; user-select:none;
  letter-spacing:2vw;
}
.nation-strip{
  position:absolute; left:0; right:0; top:0; height:3px; z-index:2;
  background:linear-gradient(90deg,
    #006C35 0 25%,      /* السعودية */
    #EF3340 25% 50%,    /* الإمارات (لمسة حمراء) */
    #DB161B 50% 75%,    /* عمان */
    #007A3D 75% 100%    /* الكويت */
  );
  opacity:0.65;
}

/* ===== HEADER ===== */
header{
  position:relative; z-index:1;
  display:flex; align-items:center; justify-content:space-between;
  padding: 1.4vh 2.2vw;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(201,162,75,0.06), transparent);
}
.brand{ display:flex; align-items:center; gap:1vw; }
.brand .mark{
  width:2.4vh; height:2.4vh; border-radius:50%;
  background:var(--live);
  box-shadow:0 0 1.2vh var(--live);
  animation: pulse 1.4s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes pulse{
  0%,100%{ transform:scale(1); opacity:1;}
  50%{ transform:scale(1.35); opacity:0.55;}
}
.brand h1{
  font-family:'Noto Kufi Arabic', sans-serif;
  font-weight:900;
  letter-spacing:0;
  font-size: clamp(18px, 2.6vw, 34px);
  color:var(--sand);
}
.brand h1 span{ color:var(--gold); }
.brand .sub{
  font-size:0.62em; color:var(--sand-dim); font-weight:500;
  margin-inline-start:0.6vw; border-inline-start:1px solid var(--line); padding-inline-start:0.8vw;
}
.clocks{ display:flex; gap:2vw; font-family:'JetBrains Mono', monospace; align-items:center; }
.clocks div.clockcell{ text-align:center; }
.clocks .flag{ font-size:1.3em; display:block; margin-bottom:2px; }
.clocks .city{ font-size:0.68em; color:var(--sand-dim); letter-spacing:0.02em;}
.clocks .time{ font-size: clamp(14px, 1.6vw, 22px); color:var(--gold); font-weight:600; direction:ltr; }

.sound-toggle{
  width:3.4vh; height:3.4vh; border-radius:50%;
  border:1px solid var(--line); background:rgba(255,255,255,0.03);
  color:var(--gold); font-size:1.5vh; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  margin-inline-start:1.6vw; flex-shrink:0;
  transition:background 0.2s, transform 0.15s;
}
.sound-toggle:hover{ background:rgba(201,162,75,0.12); transform:scale(1.06); }
.sound-toggle.muted{ color:var(--sand-dim); }

/* ===== MAIN GRID ===== */
main{
  position:relative; z-index:1;
  display:grid;
  grid-template-columns: 1.15fr 1fr 1fr;
  gap: 1.4vh 1.4vw;
  padding: 1.4vh 2.2vw;
  overflow:hidden;
}
.panel{
  background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border:1px solid var(--line);
  border-radius:10px;
  padding: 1.6vh 1.4vw;
  display:flex; flex-direction:column;
  min-height:0;
  animation: rise 0.6s ease both;
}
@keyframes rise{
  from{ opacity:0; transform:translateY(10px);}
  to{ opacity:1; transform:translateY(0);}
}
.panel h2{
  font-family:'Noto Kufi Arabic', sans-serif;
  font-weight:700;
  font-size: clamp(13px, 1.3vw, 18px);
  letter-spacing:0;
  color:var(--gold);
  border-bottom:1px solid var(--line);
  padding-bottom:0.8vh; margin-bottom:1vh;
  display:flex; align-items:center; gap:0.5em;
}
.panel h2::before{ content:"◆"; font-size:0.6em; color:var(--teal); }
.panel h2 .flagmark{ margin-inline-start:auto; font-size:0.85em; opacity:0.8; letter-spacing:0.25em; }
.scroll{ overflow-y:auto; flex:1; }
.scroll::-webkit-scrollbar{ width:4px; }
.scroll::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

.news-item{
  padding:0.9vh 0; border-bottom:1px dashed var(--line);
  font-size: clamp(11px, 0.95vw, 14px);
  animation: fadeIn 0.5s ease both;
  line-height:1.5;
}
.news-item b{ color:var(--teal); font-weight:600; display:flex; align-items:center; gap:0.4em; font-size:0.85em; margin-bottom:2px;}
@keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:0.8vh 0.8vw; }
.stat{
  background:rgba(255,255,255,0.03); border-radius:8px; padding:1vh 0.9vw;
  border:1px solid var(--line);
}
.stat .label{ font-size:0.68em; color:var(--sand-dim); letter-spacing:0.02em;}
.stat .value{ font-family:'JetBrains Mono', monospace; font-size:clamp(15px,1.6vw,22px); font-weight:600; color:var(--sand); direction:ltr; text-align:right; }
.stat.up .value{ color:var(--teal); }
.stat.down .value{ color:var(--live); }

.city-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:1vh 0; border-bottom:1px dashed var(--line);
  font-size:clamp(11px,1vw,14px);
}
.city-row .name{ display:flex; align-items:center; gap:0.5em; }
.city-row .temp{ font-family:'JetBrains Mono', monospace; color:var(--gold); font-weight:600; font-size:1.15em; direction:ltr; }

/* ===== TICKER ===== */
.ticker-wrap{
  position:relative; z-index:1;
  border-top:1px solid var(--line);
  background:linear-gradient(90deg, var(--gold), #8a6d2e);
  overflow:hidden; white-space:nowrap;
  height:5.2vh; display:flex; align-items:center;
}
.ticker-wrap .tag{
  background:var(--bg); color:var(--gold); font-family:'Noto Kufi Arabic';
  font-weight:700; letter-spacing:0; padding:0 1.4vw; height:100%;
  display:flex; align-items:center; gap:0.4em; flex-shrink:0; font-size:clamp(12px,1.1vw,16px);
}
.ticker-wrap .tag .flagmark{ font-size:0.95em; letter-spacing:0.15em; }
.ticker-track{
  display:inline-block; white-space:nowrap;
  animation: scroll-left 45s linear infinite;
  color:#1a1206; font-weight:600; font-size:clamp(12px,1.05vw,15px);
  padding-inline-start:2vw;
}
.ticker-track span{ margin-inline-end:4vw; }
@keyframes scroll-left{
  0%{ transform:translateX(0); }
  100%{ transform:translateX(-50%); }
}

.updated{
  position:fixed; bottom:0.6vh; inset-inline-end:1vw; font-size:10px;
  color:var(--sand-dim); font-family:'JetBrains Mono', monospace; opacity:0.75;
  direction:ltr; display:flex; align-items:center; gap:4px; cursor:default;
}
.health-dot{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--teal); color:var(--teal); box-shadow:0 0 4px currentColor;
  flex-shrink:0;
}
.health-dot.warn{ background:var(--gold); color:var(--gold); }
.health-dot.err{ background:var(--live); color:var(--live); }

/* ===== ORIENTATION: PORTRAIT (1080x1920) ===== */
body.portrait main{
  grid-template-columns: 1fr;
  grid-template-rows: auto auto 1fr;
  overflow-y:auto;
}
body.portrait .clocks{ display:none; }
body.portrait .brand h1{ font-size:clamp(16px,4vw,22px); }

@media (prefers-reduced-motion: reduce){
  .brand .mark, .panel, .news-item{ animation:none !important; }
  .ticker-track{ animation-duration:120s; }
}
</style>
</head>
<body>
<div class="stage">
  <div class="nation-strip"></div>
  <div class="flag-band" aria-hidden="true">🇸🇦 🇦🇪 🇴🇲 🇰🇼 🇸🇦 🇦🇪 🇴🇲 🇰🇼</div>
  <header>
    <div class="brand">
      <div class="mark"></div>
      <h1>الخليج <span>المباشر</span></h1>
      <span class="sub">غرفة أخبار الخليج</span>
    </div>
    <div style="display:flex; align-items:center;">
      <div class="clocks" id="clocks"></div>
      <button class="sound-toggle" id="soundToggle" title="كتم/تفعيل الأصوات">🔊</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>نشرة الأخبار — الخليج <span class="flagmark">🇸🇦 🇦🇪 🇴🇲 🇰🇼</span></h2>
      <div class="scroll" id="news-feed"><div class="news-item">جارٍ تحميل الأخبار…</div></div>
    </section>

    <section class="panel">
      <h2>الأسواق والعملات</h2>
      <div class="grid-2" id="markets-grid"></div>
      <h2 style="margin-top:1.4vh">حركة الطيران</h2>
      <div class="grid-2" id="flights-grid"></div>
    </section>

    <section class="panel">
      <h2>الطقس — العواصم</h2>
      <div class="scroll" id="weather-list"></div>
    </section>
  </main>

  <div class="ticker-wrap">
    <div class="tag"><span class="flagmark">●</span> مباشر</div>
    <div class="ticker-track" id="ticker" dir="rtl"><span>جارٍ تحميل الشريط الإخباري…</span></div>
  </div>
</div>
<div class="updated" id="updated"><span class="health-dot" id="healthDot" title="الحالة"></span> <span id="updatedText"></span></div>

<script>
/* ===================== إعداد المدن والأعلام ===================== */
const TZ = {
  "الرياض": { tz:"Asia/Riyadh", flag:"🇸🇦" },
  "دبي":    { tz:"Asia/Dubai",  flag:"🇦🇪" },
  "مسقط":   { tz:"Asia/Muscat", flag:"🇴🇲" },
  "الكويت": { tz:"Asia/Kuwait", flag:"🇰🇼" }
};

const NEWS_SOURCE_LABELS = {
  "Google News - Saudi Arabia": "السعودية 🇸🇦",
  "Google News - UAE":          "الإمارات 🇦🇪",
  "Google News - Oman":         "عُمان 🇴🇲",
  "Google News - Kuwait":       "الكويت 🇰🇼"
};

const WEATHER_CITY_LABELS = {
  "Riyadh":     { name:"الرياض",     flag:"🇸🇦" },
  "Jeddah":     { name:"جدة",        flag:"🇸🇦" },
  "Dubai":      { name:"دبي",        flag:"🇦🇪" },
  "Abu Dhabi":  { name:"أبوظبي",     flag:"🇦🇪" },
  "Muscat":     { name:"مسقط",       flag:"🇴🇲" },
  "Kuwait City":{ name:"مدينة الكويت", flag:"🇰🇼" }
};

const MARKET_LABELS = {
  "USD/SAR": "دولار/ريال سعودي",
  "USD/AED": "دولار/درهم إماراتي",
  "USD/OMR": "دولار/ريال عُماني",
  "USD/KWD": "دولار/دينار كويتي",
  "Brent Crude": "خام برنت",
  "Gold": "الذهب (أونصة)"
};
const CRYPTO_LABELS = { "bitcoin":"بيتكوين", "ethereum":"إيثيريوم" };

const FLIGHT_LABELS = {
  "DXB (Dubai)":  "مطار دبي — DXB",
  "RUH (Riyadh)": "مطار الرياض — RUH",
  "MCT (Muscat)": "مطار مسقط — MCT"
};

/* ===================== نظام الأصوات (بيبات ناعمة للأخبار والحركة) ===================== */
let audioCtx = null;
let soundEnabled = true;
try{ soundEnabled = localStorage.getItem('gcc_sound') !== 'off'; }catch(e){}

function ensureAudio(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    audioCtx = new Ctx();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep({freq=880, duration=0.09, volume=0.045, type='sine', delay=0}={}){
  if(!soundEnabled) return;
  const ctx = ensureAudio();
  if(!ctx) return;
  try{
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }catch(e){}
}

// أول تفاعل من المستخدم يفعّل الصوت (سياسات المتصفح تمنع الصوت التلقائي)
['click','touchstart','keydown'].forEach(evt => {
  window.addEventListener(evt, () => ensureAudio(), { once:true, passive:true });
});

function updateSoundIcon(){
  const btn = document.getElementById('soundToggle');
  btn.textContent = soundEnabled ? '🔊' : '🔇';
  btn.classList.toggle('muted', !soundEnabled);
}
document.getElementById('soundToggle').addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  try{ localStorage.setItem('gcc_sound', soundEnabled ? 'on' : 'off'); }catch(e){}
  updateSoundIcon();
  if(soundEnabled) beep({freq:990, duration:0.08, volume:0.05});
});
updateSoundIcon();

/* بيب خفيف مرافق لكل ظهور حركة/دوران للشريط الإخباري */
document.getElementById('ticker').addEventListener('animationiteration', () => {
  beep({freq:1046, duration:0.07, volume:0.03, type:'triangle'});
});

/* ===================== الساعات ===================== */
function renderClocks(){
  const el = document.getElementById('clocks');
  el.innerHTML = Object.entries(TZ).map(([city, info]) => {
    const t = new Date().toLocaleTimeString('ar', {timeZone: info.tz, hour:'2-digit', minute:'2-digit', numberingSystem:'latn'});
    return `<div class="clockcell"><span class="flag">${info.flag}</span><div class="city">${city}</div><div class="time">${t}</div></div>`;
  }).join('');
}
setInterval(renderClocks, 1000);
renderClocks();

function detectOrientation(){
  const isPortrait = window.innerHeight > window.innerWidth;
  document.body.classList.toggle('portrait', isPortrait);
}
window.addEventListener('resize', detectOrientation);
detectOrientation();

/* ===================== تحميل البيانات ===================== */
let lastNewsHash = '';
let lastTickerHash = '';

async function loadData(){
  try{
    const res = await fetch('data.json?_=' + Date.now());
    const data = await res.json();
    renderNews(data.news || {});
    renderMarkets(data.markets || {});
    renderWeather(data.weather || {});
    renderFlights(data.flights || {});
    renderTicker(data);
    document.getElementById('updatedText').textContent =
      'آخر تحديث: ' + new Intl.DateTimeFormat('ar', {numberingSystem:'latn', dateStyle:'short', timeStyle:'medium'}).format(new Date(data.generated_at_utc));
    renderHealth(data._meta);
  }catch(e){
    console.error('تعذّر تحميل data.json', e);
    const dot = document.getElementById('healthDot');
    dot.className = 'health-dot err';
    dot.title = 'تعذّر تحميل data.json في المتصفح: ' + e.message;
  }
}

function renderHealth(meta){
  const dot = document.getElementById('healthDot');
  if(!meta){ dot.className = 'health-dot'; dot.title = 'لا توجد معلومات تشخيصية'; return; }
  const errors = meta.errors || [];
  if(errors.length === 0){
    dot.className = 'health-dot';
    dot.title = 'كل المصادر تعمل بشكل طبيعي ✅';
  } else {
    const failedSources = Object.entries(meta.status || {}).filter(([,ok]) => !ok).map(([s]) => s);
    const allDown = failedSources.length > 0 && Object.values(meta.status || {}).every(v => !v);
    dot.className = 'health-dot ' + (allDown ? 'err' : 'warn');
    dot.title = 'مصادر متعطلة: ' + errors.map(e => `${e.source} (${e.stage}): ${e.error}`).join(' | ');
  }
}

function renderNews(news){
  const el = document.getElementById('news-feed');
  const items = [];
  for(const [source, arr] of Object.entries(news)){
    const label = NEWS_SOURCE_LABELS[source] || source;
    (arr || []).slice(0,3).forEach(item => items.push({ label, title: item.title_ar || item.title }));
  }
  const hash = JSON.stringify(items.map(i => i.title));
  const isNew = hash !== lastNewsHash;
  lastNewsHash = hash;

  el.innerHTML = items.length
    ? items.map(i => `<div class="news-item"><b>${i.label}</b>${escapeHtml(i.title)}</div>`).join('')
    : '<div class="news-item">لا توجد بيانات متاحة حالياً.</div>';

  // بيب متتابع وناعم مع ظهور كل خبر — كأنه نقر برقية أخبار
  if(isNew){
    document.querySelectorAll('#news-feed .news-item').forEach((node, i) => {
      node.style.animationDelay = (i * 0.06) + 's';
      beep({ freq: 620 + (i % 5) * 30, duration:0.05, volume:0.03, delay: i * 0.08 });
    });
  }
}

function renderMarkets(markets){
  const el = document.getElementById('markets-grid');
  let html = '';
  for(const [label, val] of Object.entries(markets)){
    if(label === 'crypto'){
      for(const [coin, prices] of Object.entries(val || {})){
        const name = CRYPTO_LABELS[coin] || coin;
        html += `<div class="stat"><div class="label">${name}</div><div class="value">$${(prices.usd||0).toLocaleString('en-US')}</div></div>`;
      }
    } else {
      const name = MARKET_LABELS[label] || label;
      html += `<div class="stat"><div class="label">${name}</div><div class="value">${val}</div></div>`;
    }
  }
  el.innerHTML = html || '<div class="stat"><div class="label">الأسواق</div><div class="value">—</div></div>';
}

function renderWeather(weather){
  const el = document.getElementById('weather-list');
  let html = '';
  for(const [city, w] of Object.entries(weather)){
    const info = WEATHER_CITY_LABELS[city] || { name: city, flag:'' };
    const t = w.temperature_2m !== undefined ? Math.round(w.temperature_2m) + '°C' : '—';
    html += `<div class="city-row"><span class="name">${info.flag} ${info.name}</span><span class="temp">${t}</span></div>`;
  }
  el.innerHTML = html || '<div class="city-row">جارٍ التحميل…</div>';
}

function renderFlights(flights){
  const el = document.getElementById('flights-grid');
  let html = '';
  for(const [ap, count] of Object.entries(flights)){
    const name = FLIGHT_LABELS[ap] || ap;
    html += `<div class="stat"><div class="label">${name}</div><div class="value">${count} رحلة</div></div>`;
  }
  el.innerHTML = html || '<div class="stat"><div class="label">حركة الطيران</div><div class="value">—</div></div>';
}

function renderTicker(data){
  const parts = [];
  for(const [source, arr] of Object.entries(data.news || {})){
    (arr||[]).slice(0,2).forEach(i => parts.push(i.title_ar || i.title));
  }
  const track = document.getElementById('ticker');
  const hash = JSON.stringify(parts);
  const isNew = hash !== lastTickerHash;
  lastTickerHash = hash;

  const content = parts.map(p => `<span>${escapeHtml(p)}</span>`).join('');
  track.innerHTML = content + content; // مكرر لضمان استمرارية الحركة

  if(isNew){
    beep({freq:880, duration:0.09, volume:0.035});
    beep({freq:1175, duration:0.09, volume:0.03, delay:0.09});
  }
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

loadData();
// المصدر (fetch_data.py) لا يتحدّث إلا كل 5 ساعات عبر GitHub Actions،
// فحص كل 5 دقائق من جهة المتصفح يكفي لالتقاط أي تحديث بسرعة دون طلبات زائدة
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
