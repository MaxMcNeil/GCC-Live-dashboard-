<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الخليج المباشر — الرياض · دبي · مسقط · الكويت</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1220;
  --panel:#121B2E;
  --panel-2:#0E1626;
  --gold:#C9A24B;
  --live:#E63946;
  --teal:#2FBEA5;
  --sand:#EDE6D6;
  --sand-dim:#9AA3B5;
  --line:rgba(201,162,75,0.18);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{
  width:100%; height:100%; overflow:hidden;
  background:radial-gradient(ellipse at 80% -10%, #16223a 0%, var(--bg) 55%);
  color:var(--sand);
  font-family:'IBM Plex Sans Arabic', sans-serif;
}
.stage{
  width:100vw; height:100vh;
  display:grid;
  grid-template-rows: auto 1fr auto;
  position:relative;
}
.nation-strip{
  position:absolute; left:0; right:0; top:0; height:3px; z-index:2;
  background:linear-gradient(90deg,
    #006C35 0 25%,      /* السعودية */
    #EF3340 25% 50%,    /* الإمارات (لمسة حمراء) */
    #DB161B 50% 75%,    /* عمان */
    #007A3D 75% 100%    /* الكويت */
  );
  opacity:0.65;
}

/* ===== HEADER ===== */
header{
  position:relative; z-index:1;
  display:flex; align-items:center; justify-content:space-between;
  padding: 1.2vh 2.2vw;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(201,162,75,0.06), transparent);
  flex-wrap:wrap; row-gap:0.8vh;
}
.brand{ display:flex; align-items:center; gap:1vw; }
.brand .mark{
  width:2.2vh; height:2.2vh; border-radius:50%;
  background:var(--live);
  box-shadow:0 0 1.2vh var(--live);
  animation: pulse 1.4s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes pulse{
  0%,100%{ transform:scale(1); opacity:1;}
  50%{ transform:scale(1.35); opacity:0.55;}
}
.brand h1{
  font-family:'Noto Kufi Arabic', sans-serif;
  font-weight:900;
  font-size: clamp(16px, 2.2vw, 28px);
  color:var(--sand);
}
.brand h1 span{ color:var(--gold); }

/* ساعات المدن — مكبّرة بشكل واضح كي تبقى مقروءة من بعيد على الشاشة الحية */
.clocks{ display:flex; gap:2vw; font-family:'JetBrains Mono', monospace; align-items:center; }
.clocks div.clockcell{ text-align:center; }
.clocks .flag{ font-size:clamp(18px, 2vw, 30px); display:block; margin-bottom:2px; }
.clocks .city{ font-size:clamp(11px, 1.15vw, 16px); color:var(--sand-dim); letter-spacing:0.02em; font-weight:500;}
.clocks .time{ font-size: clamp(24px, 3.1vw, 44px); color:var(--gold); font-weight:700; direction:ltr; letter-spacing:0.01em;}

.sound-toggle{
  width:3.2vh; height:3.2vh; border-radius:50%;
  border:1px solid var(--line); background:rgba(255,255,255,0.03);
  color:var(--gold); font-size:1.4vh; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  margin-inline-start:1.6vw; flex-shrink:0;
  transition:background 0.2s, transform 0.15s;
}
.sound-toggle:hover{ background:rgba(201,162,75,0.12); transform:scale(1.06); }
.sound-toggle.muted{ color:var(--sand-dim); }

/* ===== ZONE PRINCIPALE : une seule grande scène (l'actu vedette) =====
   L'ancienne "scène statistiques" plein écran a été retirée : elle
   masquait l'actualité et rendait les chiffres illisibles. Les données
   marchés/météo/vols vivent désormais dans une petite pastille flottante
   (voir .stat-popup) qui ne recouvre jamais le texte. */
main{
  position:relative; z-index:1;
  padding: 2vh 3vw;
  min-height:0;
}
#mainStage{ position:relative; width:100%; height:100%; }

.scene{
  position:relative; width:100%; height:100%;
  background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border:1px solid var(--line);
  border-radius:16px;
  display:flex; flex-direction:column;
  padding: clamp(16px,3.4vh,40px) clamp(18px,4.4vw,56px);
}

.hero-top{
  display:flex; align-items:center; justify-content:space-between;
  gap:1em; flex-shrink:0;
  margin-bottom:clamp(14px,3vh,32px);
}
.hero-tag{
  display:inline-flex; align-self:flex-start;
  background:rgba(201,162,75,0.14); color:var(--gold);
  border:1px solid var(--line); border-radius:999px;
  padding:0.9vh 1.8vw; font-size:clamp(13px,1.5vw,19px); font-weight:700;
  font-family:'Noto Kufi Arabic', sans-serif;
}
/* شارة الأعلام — تعرض علم/أعلام الدول الخليجية المعنيّة بالخبر الظاهر حاليًا،
   بشكل فني (تكديس خفيف + توهّج) دون أي تأثير على مساحة العنوان الكبير */
.hero-flags{
  display:flex; align-items:center;
  font-size:clamp(22px,3vw,40px);
  filter:drop-shadow(0 3px 8px rgba(0,0,0,0.5));
}
.hero-flags span{
  display:inline-block;
  margin-inline-start:-0.22em;
  animation: flag-pop 0.45s ease backwards;
}
.hero-flags span:first-child{ margin-inline-start:0; }
.hero-flags span:nth-child(1){ animation-delay:0s; }
.hero-flags span:nth-child(2){ animation-delay:0.08s; }
.hero-flags span:nth-child(3){ animation-delay:0.16s; }
@keyframes flag-pop{
  from{ opacity:0; transform:translateY(-6px) scale(0.7); }
  to{ opacity:1; transform:translateY(0) scale(1); }
}

.hero-body{ flex:1; display:flex; align-items:center; min-height:0; }
.hero-title{
  font-family:'Noto Kufi Arabic', sans-serif;
  font-weight:900;
  font-size: clamp(30px, 6vw, 84px);
  line-height:1.32;
  color:var(--sand);
  transition: opacity 0.3s ease, transform 0.3s ease;
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:5; overflow:hidden;
}
.hero-title.long{ font-size:clamp(24px,4.6vw,58px); }
.hero-title.xlong{ font-size:clamp(20px,3.6vw,44px); }
.hero-title.swap{ opacity:0; transform:translateY(12px) scale(0.98); }

.hero-footer{ flex-shrink:0; margin-top:clamp(14px,3vh,30px); }
/* مصدر الخبر — يُستخرج من نهاية العنوان الأصلي ويُعرض هنا بشكل منفصل
   ومقروء لكن بتنسيق مختلف تمامًا عن العنوان الضخم، أسفل البطاقة */
.hero-source{
  display:inline-flex; align-items:center; gap:0.6em;
  font-family:'IBM Plex Sans Arabic', sans-serif; font-weight:600;
  font-size:clamp(12px,1.25vw,17px); color:var(--sand-dim);
  background:rgba(255,255,255,0.05); border:1px solid var(--line);
  border-radius:999px; padding:0.45em 1.2em;
  margin-bottom:clamp(10px,1.8vh,18px);
}
.hero-source::before{ content:"🖋"; opacity:0.7; }
.hero-source:empty{ display:none; }
.hero-progress{
  height:7px; border-radius:5px; background:rgba(255,255,255,0.07); overflow:hidden;
}
.hero-progress-bar{
  height:100%; width:0%; background:linear-gradient(90deg, var(--teal), var(--gold));
  border-radius:5px;
}

/* ===== PASTILLE FLOTTANTE : marchés / météo / vols =====
   Remplace l'ancienne scène plein écran illisible. Une seule donnée à la
   fois, très soignée, qui boucle indéfiniment avec un petit bip à chaque
   changement — sans jamais recouvrir le texte de l'actualité. Fonctionne
   à l'identique en horizontal et en vertical (voir règles .portrait ci-dessous). */
.stat-popup{
  position:fixed;
  bottom: calc(7.6vh + 1.3vh);
  inset-inline-start: 2.4vw;
  z-index:5;
  display:flex; align-items:center; gap:0.85em;
  background:linear-gradient(135deg, rgba(18,27,46,0.93), rgba(14,22,38,0.93));
  border:1px solid var(--line);
  border-radius:16px;
  padding:0.85em 1.3em;
  box-shadow:0 10px 30px rgba(0,0,0,0.45), 0 0 0 1px rgba(201,162,75,0.06);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  max-width: clamp(220px, 27vw, 380px);
  transition: opacity 0.32s ease, transform 0.32s ease;
}
.stat-popup.swap{ opacity:0; transform:translateY(10px) scale(0.95); }
.stat-popup.empty{ display:none; }
.popup-live-dot{
  position:absolute; top:-4px; inset-inline-end:-4px;
  width:8px; height:8px; border-radius:50%;
  background:var(--teal); box-shadow:0 0 6px var(--teal);
  animation:pulse 1.8s ease-in-out infinite;
}
.popup-icon{ font-size:clamp(22px,2.6vw,34px); flex-shrink:0; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4)); }
.popup-text{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.popup-label{
  font-size:clamp(11px,1.1vw,14px); color:var(--sand-dim);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.popup-value{
  font-family:'JetBrains Mono', monospace; font-weight:700;
  font-size:clamp(16px,1.9vw,25px); color:var(--gold); direction:ltr;
}

/* ===== BANDEAU DÉFILANT (défilement JS pixel-parfait, réellement sans fin) =====
   L'ancienne animation CSS % pouvait laisser un "trou" vide après un tour
   lorsque le contenu était plus court que la largeur visible. On mesure
   désormais la largeur réelle d'une copie du contenu, on en répète
   suffisamment de copies pour ne jamais tomber à court, et on fait défiler
   via requestAnimationFrame en rebouclant en pixels — donc toujours fluide,
   toujours continu, quelle que soit la quantité de texte. ===== */
.ticker-wrap{
  position:relative; z-index:1;
  border-top:1px solid var(--line);
  background:linear-gradient(90deg, var(--gold), #8a6d2e);
  overflow:hidden; white-space:nowrap;
  height:7.6vh; display:flex; align-items:center;
}
.ticker-wrap .tag{
  background:var(--bg); color:var(--gold); font-family:'Noto Kufi Arabic';
  font-weight:700; padding:0 1.6vw; height:100%;
  display:flex; align-items:center; gap:0.4em; flex-shrink:0;
  font-size:clamp(14px,1.4vw,19px);
}
.ticker-track{
  display:flex; flex-shrink:0; width:max-content;
  will-change:transform;
  color:#1a1206; font-weight:700; font-size:clamp(17px,1.75vw,25px);
  padding-inline-start:2vw;
}
.ticker-track > span{
  margin-inline-end:4.5vw; display:flex; align-items:center; gap:0.7em; flex-shrink:0;
}
.ticker-track > span::before{
  content:"●"; font-size:0.4em; margin-inline-end:0.9vw; opacity:0.4; vertical-align:middle;
}
.ticker-flags{ font-size:1.25em; display:inline-flex; filter:drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
.ticker-flags span{ margin-inline-start:-0.2em; }
.ticker-flags span:first-child{ margin-inline-start:0; }
.ticker-col{ display:flex; flex-direction:column; align-items:flex-start; line-height:1.18; gap:2px; }
.ticker-title{ display:block; }
.ticker-source{
  font-size:0.46em; font-weight:600; opacity:0.75;
  background:rgba(0,0,0,0.14); padding:1px 9px; border-radius:6px;
  font-family:'IBM Plex Sans Arabic', sans-serif;
}

.updated{
  position:fixed; bottom:0.6vh; inset-inline-end:1vw; font-size:10px;
  color:var(--sand-dim); font-family:'JetBrains Mono', monospace; opacity:0.75;
  direction:ltr; display:flex; align-items:center; gap:4px; cursor:default;
  z-index:6;
}
.health-dot{
  display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--teal); color:var(--teal); box-shadow:0 0 4px currentColor;
  flex-shrink:0;
}
.health-dot.warn{ background:var(--gold); color:var(--gold); }
.health-dot.err{ background:var(--live); color:var(--live); }

/* ===== ORIENTATION (détection auto : portrait 1080x1920 / paysage 1920x1080) ===== */
body.portrait header{ padding: 1vh 3vw; }
body.portrait .clocks{ gap:3vw; }
body.portrait .clocks .time{ font-size:clamp(17px, 3.6vw, 26px); }
body.portrait .clocks .city{ font-size:clamp(9px, 2vw, 13px); }
body.portrait .clocks .flag{ font-size:clamp(14px, 3vw, 20px); }

body.portrait .stat-popup{
  inset-inline-start:3vw; inset-inline-end:3vw; max-width:none;
  justify-content:center; bottom: calc(7.6vh + 1vh);
}
body.portrait .hero-flags{ font-size:clamp(20px,4.4vw,32px); }

@media (prefers-reduced-motion: reduce){
  /* بعض إصدارات متصفح OBS المدمج (CEF) تُبلِّغ "reduce" افتراضيًا حتى لو لم
     يطلبه المستخدم فعليًا. لذلك نُبقي على الحركات الوظيفية (الشريط، تبديل
     الأخبار، شريط التقدّم) ونكتفي بإيقاف النبض الزخرفي فقط. */
  .brand .mark{ animation:none !important; }
}
</style>
</head>
<body>
<div class="stage">
  <div class="nation-strip"></div>
  <header>
    <div class="brand">
      <div class="mark"></div>
      <h1>الخليج <span>المباشر</span></h1>
    </div>
    <div style="display:flex; align-items:center;">
      <div class="clocks" id="clocks"></div>
      <button class="sound-toggle" id="soundToggle" title="كتم/تفعيل الأصوات">🔊</button>
    </div>
  </header>

  <main>
    <div id="mainStage">
      <section class="scene" id="heroNews">
        <div class="hero-top">
          <div class="hero-tag" id="heroTag">الخليج المباشر</div>
          <div class="hero-flags" id="heroFlags"></div>
        </div>
        <div class="hero-body">
          <div class="hero-title" id="heroTitle">جارٍ تحميل الأخبار…</div>
        </div>
        <div class="hero-footer">
          <div class="hero-source" id="heroSource"></div>
          <div class="hero-progress"><div class="hero-progress-bar" id="heroProgressBar"></div></div>
        </div>
      </section>
    </div>
  </main>

  <div class="ticker-wrap">
    <div class="tag"><span>●</span> مباشر</div>
    <div class="ticker-track" id="ticker" dir="rtl"><span>جارٍ تحميل الشريط الإخباري…</span></div>
  </div>
</div>

<div class="stat-popup empty" id="statPopup">
  <span class="popup-live-dot"></span>
  <span class="popup-icon" id="popupIcon">📊</span>
  <div class="popup-text">
    <div class="popup-label" id="popupLabel">—</div>
    <div class="popup-value" id="popupValue">—</div>
  </div>
</div>

<div class="updated" id="updated"><span class="health-dot" id="healthDot" title="الحالة"></span> <span id="updatedText"></span></div>

<script>
/* ===================== إعداد المدن والأعلام ===================== */
const TZ = {
  "الرياض": { tz:"Asia/Riyadh", flag:"🇸🇦" },
  "دبي":    { tz:"Asia/Dubai",  flag:"🇦🇪" },
  "مسقط":   { tz:"Asia/Muscat", flag:"🇴🇲" },
  "الكويت": { tz:"Asia/Kuwait", flag:"🇰🇼" }
};

const NEWS_SOURCE_LABELS = {};

const WEATHER_CITY_LABELS = {
  "Riyadh":     { name:"الرياض",     flag:"🇸🇦" },
  "Jeddah":     { name:"جدة",        flag:"🇸🇦" },
  "Dubai":      { name:"دبي",        flag:"🇦🇪" },
  "Abu Dhabi":  { name:"أبوظبي",     flag:"🇦🇪" },
  "Muscat":     { name:"مسقط",       flag:"🇴🇲" },
  "Kuwait City":{ name:"مدينة الكويت", flag:"🇰🇼" }
};

const MARKET_LABELS = {
  "USD/SAR": "دولار/ريال سعودي",
  "USD/AED": "دولار/درهم إماراتي",
  "USD/OMR": "دولار/ريال عُماني",
  "USD/KWD": "دولار/دينار كويتي",
  "Brent Crude": "خام برنت",
  "Gold": "الذهب (أونصة)"
};
const CRYPTO_LABELS = { "bitcoin":"بيتكوين", "ethereum":"إيثيريوم" };

const FLIGHT_LABELS = {
  "DXB (Dubai)":  "مطار دبي — DXB",
  "RUH (Riyadh)": "مطار الرياض — RUH",
  "MCT (Muscat)": "مطار مسقط — MCT"
};

/* ===================== الدول الخليجية: كشف الأعلام من نص الخبر =====================
   لكل خبر نبدأ بعلم مصدره (مستخرَج تلقائيًا من اسم الخلاصة نفسها، مثل
   "أخبار عُمان 🇴🇲")، ثم نفحص نص العنوان بحثًا عن أي دولة خليجية أخرى
   مذكورة صراحة؛ إن وُجدت، تُضاف كل الأعلام المعنية معًا (مثال: خبر عن
   "الكويت وعُمان" يعرض العلمين). "عمان" بلا تشكيل مستبعدة عمدًا لتفادي
   الخلط مع العاصمة الأردنية "عمّان" — نعتمد على "عُمان" المُشكَّلة كما
   ترد فعليًا في خلاصات المصدر، أو على ذكر "مسقط"/"سلطنة عمان". */
const GULF_KEYWORDS = [
  { flag:"🇸🇦", words:["السعودية","سعودي","الرياض","جدة"] },
  { flag:"🇦🇪", words:["الإمارات","إماراتي","دبي","أبوظبي","أبو ظبي"] },
  { flag:"🇴🇲", words:["عُمان","سلطنة عمان","مسقط"] },
  { flag:"🇰🇼", words:["الكويت","كويتي"] },
  { flag:"🇶🇦", words:["قطر","قطري","الدوحة"] },
  { flag:"🇧🇭", words:["البحرين","بحريني","المنامة"] }
];
function extractFeedFlag(feedLabel){
  const m = (feedLabel||'').match(/\p{Regional_Indicator}{2}/gu);
  return m ? m[0] : null;
}
function detectGulfFlags(feedLabel, title){
  const flags = new Set();
  const base = extractFeedFlag(feedLabel);
  if(base) flags.add(base);
  const t = title || '';
  for(const {flag, words} of GULF_KEYWORDS){
    if(words.some(w => t.includes(w))) flags.add(flag);
  }
  return Array.from(flags);
}

/* ===================== فصل مصدر الخبر عن العنوان =====================
   خلاصات Google News تُلحق اسم الموقع الناشر في نهاية العنوان
   ("... - العربية"). نستخرجه هنا كي يُعرض بشكل منفصل وأنيق أسفل
   البطاقة/الشريط بدل أن يبقى ملتصقًا بنهاية العنوان الضخم. */
function splitTitleSource(rawTitle){
  const t = (rawTitle || '').trim();
  const sepRegex = /\s[-–—]\s/g;
  let lastIdx = -1, lastSepLen = 0, m;
  while((m = sepRegex.exec(t))){ lastIdx = m.index; lastSepLen = m[0].length; }
  if(lastIdx > 0){
    const source = t.slice(lastIdx + lastSepLen).trim();
    if(source.length >= 2 && source.length <= 40){
      return { title: t.slice(0, lastIdx).trim(), source };
    }
  }
  return { title: t, source: '' };
}

/* ===================== نظام الأصوات (بيبات ناعمة) ===================== */
let audioCtx = null;
let soundEnabled = true;
try{ soundEnabled = localStorage.getItem('gcc_sound') !== 'off'; }catch(e){}

function ensureAudio(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return null;
    audioCtx = new Ctx();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function beep({freq=880, duration=0.09, volume=0.045, type='sine', delay=0}={}){
  if(!soundEnabled) return;
  const ctx = ensureAudio();
  if(!ctx) return;
  try{
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(volume, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }catch(e){}
}

['click','touchstart','keydown'].forEach(evt => {
  window.addEventListener(evt, () => ensureAudio(), { once:true, passive:true });
});

function updateSoundIcon(){
  const btn = document.getElementById('soundToggle');
  btn.textContent = soundEnabled ? '🔊' : '🔇';
  btn.classList.toggle('muted', !soundEnabled);
}
document.getElementById('soundToggle').addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  try{ localStorage.setItem('gcc_sound', soundEnabled ? 'on' : 'off'); }catch(e){}
  updateSoundIcon();
  if(soundEnabled) beep({freq:990, duration:0.08, volume:0.05});
});
updateSoundIcon();

/* ===================== الساعات (مكبّرة) ===================== */
function renderClocks(){
  const el = document.getElementById('clocks');
  el.innerHTML = Object.entries(TZ).map(([city, info]) => {
    const t = new Date().toLocaleTimeString('ar', {timeZone: info.tz, hour:'2-digit', minute:'2-digit', numberingSystem:'latn'});
    return `<div class="clockcell"><span class="flag">${info.flag}</span><div class="city">${city}</div><div class="time">${t}</div></div>`;
  }).join('');
}
setInterval(renderClocks, 1000);
renderClocks();

let lastData = null;

function detectOrientation(){
  const w = document.documentElement.clientWidth || window.innerWidth;
  const h = document.documentElement.clientHeight || window.innerHeight;
  const wasPortrait = document.body.classList.contains('portrait');
  document.body.classList.toggle('portrait', h > w);
  const isPortrait = document.body.classList.contains('portrait');
  if(isPortrait !== wasPortrait && lastData){
    lastTickerHash = '';
    renderTicker(lastData);
  }
}
let resizeDebounce;
window.addEventListener('resize', () => {
  clearTimeout(resizeDebounce);
  resizeDebounce = setTimeout(() => {
    detectOrientation();
    if(lastData){ lastTickerHash = ''; renderTicker(lastData); }
  }, 220);
});
detectOrientation();
[0, 150, 500, 1500, 3000].forEach(t => setTimeout(detectOrientation, t));
if(window.ResizeObserver){
  new ResizeObserver(() => { detectOrientation(); }).observe(document.documentElement);
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ===================== الخبر الرئيسي (خبر واحد ضخم في كل مرة) ===================== */
let lastNewsHash = '';
let heroItems = [];
let heroIndex = 0;
let heroTimer = null;

function renderNews(news){
  const items = [];
  for(const [source, arr] of Object.entries(news)){
    const label = NEWS_SOURCE_LABELS[source] || source;
    (arr || []).slice(0,6).forEach(item => {
      const raw = item.title_ar || item.title;
      const { title, source: outlet } = splitTitleSource(raw);
      const flags = detectGulfFlags(source, raw);
      items.push({ label, title, outlet, flags });
    });
  }
  const hash = JSON.stringify(items.map(i => i.title));
  const isNew = hash !== lastNewsHash;
  lastNewsHash = hash;
  if(!isNew) return;

  clearTimeout(heroTimer);
  heroItems = items;
  heroIndex = 0;

  if(!items.length){
    document.getElementById('heroTag').textContent = 'الخليج المباشر';
    document.getElementById('heroTitle').textContent = 'لا توجد بيانات متاحة حالياً.';
    document.getElementById('heroSource').textContent = '';
    document.getElementById('heroFlags').innerHTML = '';
    return;
  }
  showHeroItem(0, false);
}

function showHeroItem(idx, animate){
  heroIndex = idx;
  const item = heroItems[idx % heroItems.length];
  const tagEl = document.getElementById('heroTag');
  const titleEl = document.getElementById('heroTitle');
  const sourceEl = document.getElementById('heroSource');
  const flagsEl = document.getElementById('heroFlags');
  const barEl = document.getElementById('heroProgressBar');

  const apply = () => {
    tagEl.textContent = item.label;
    titleEl.textContent = item.title;
    titleEl.classList.remove('swap');
    titleEl.classList.toggle('long', item.title.length > 80);
    titleEl.classList.toggle('xlong', item.title.length > 150);
    sourceEl.textContent = item.outlet ? ('المصدر · ' + item.outlet) : '';
    flagsEl.innerHTML = item.flags.map(f => `<span>${f}</span>`).join('');
    beep({freq:660, duration:0.07, volume:0.035, type:'sine'});

    barEl.style.transition = 'none';
    barEl.style.width = '0%';
    void barEl.offsetWidth;
    const dwell = Math.min(11000, Math.max(5200, 3200 + item.title.length * 42));
    barEl.style.transition = `width ${dwell}ms linear`;
    barEl.style.width = '100%';

    clearTimeout(heroTimer);
    heroTimer = setTimeout(() => {
      showHeroItem((heroIndex + 1) % heroItems.length, true);
    }, dwell);
  };

  if(animate){
    titleEl.classList.add('swap');
    setTimeout(apply, 300);
  } else {
    apply();
  }
}

/* ===================== الپاستيّة العائمة: أسواق + طقس + طيران =====================
   بدل الشاشة الكاملة القديمة (كانت تُخفي الخبر وتبدو رديئة)، نعرض بندًا
   واحدًا صغيرًا وأنيقًا في كل مرة، في ركن ثابت لا يزعج القراءة، ويدور
   إلى ما لا نهاية مع بيب لطيف عند كل تبديل — أفقيًا وعموديًا على حدّ سواء. */
const POPUP_DWELL_MS = 6000;
let popupItems = [];
let popupIndex = 0;
let popupTimer = null;
let lastPopupHash = '';

function buildPopupItems(data){
  const items = [];
  const markets = data.markets || {};
  for(const [label, val] of Object.entries(markets)){
    if(label === 'crypto'){
      for(const [coin, prices] of Object.entries(val || {})){
        items.push({ icon:'💰', label: CRYPTO_LABELS[coin] || coin, value: '$' + (prices.usd||0).toLocaleString('en-US') });
      }
    } else {
      items.push({ icon:'💹', label: MARKET_LABELS[label] || label, value: String(val) });
    }
  }
  for(const [city, w] of Object.entries(data.weather || {})){
    if(w.temperature_2m === undefined) continue;
    const info = WEATHER_CITY_LABELS[city] || { name:city, flag:'🌡️' };
    items.push({ icon: info.flag || '🌡️', label: info.name, value: Math.round(w.temperature_2m) + '°م' });
  }
  for(const [ap, count] of Object.entries(data.flights || {})){
    items.push({ icon:'✈️', label: FLIGHT_LABELS[ap] || ap, value: count + ' رحلة' });
  }
  return items;
}

function renderPopupItem(idx, animate){
  const el = document.getElementById('statPopup');
  if(!popupItems.length){ el.classList.add('empty'); return; }
  el.classList.remove('empty');
  const item = popupItems[idx % popupItems.length];
  const iconEl = document.getElementById('popupIcon');
  const labelEl = document.getElementById('popupLabel');
  const valueEl = document.getElementById('popupValue');

  const apply = () => {
    iconEl.textContent = item.icon;
    labelEl.textContent = item.label;
    valueEl.textContent = item.value;
    el.classList.remove('swap');
    beep({freq:720, duration:0.08, volume:0.03});
    beep({freq:980, duration:0.08, volume:0.025, delay:0.09});
  };
  if(animate){
    el.classList.add('swap');
    setTimeout(apply, 260);
  } else {
    apply();
  }
}

function refreshPopup(data){
  const items = buildPopupItems(data);
  const hash = JSON.stringify(items);
  if(hash === lastPopupHash){ popupItems = items; return; }
  lastPopupHash = hash;
  popupItems = items;
  if(!items.length){
    clearInterval(popupTimer);
    document.getElementById('statPopup').classList.add('empty');
    return;
  }
  popupIndex = 0;
  renderPopupItem(0, false);
  clearInterval(popupTimer);
  popupTimer = setInterval(() => {
    popupIndex = (popupIndex + 1) % popupItems.length;
    renderPopupItem(popupIndex, true);
  }, POPUP_DWELL_MS);
}

/* ===================== البانر السفلي (دوران أبدي حقيقي بالبكسل عبر JS) =====================
   نقيس عرض نسخة واحدة من المحتوى فعليًا، نكرّرها حتى تغطي ضعف عرض
   الشاشة على الأقل، ثم نُحرّك الشريط بواسطة requestAnimationFrame مع
   إعادة تدوير الموضع بالبكسل (لا بالنسبة المئوية) — فلا يظهر أي "فراغ"
   بعد الدورة الأولى مهما كانت كمية النصوص قصيرة أو طويلة، وتبقى السرعة
   ثابتة ومريحة للعين دومًا. */
let lastTickerHash = '';
let tickerRAF = null;
let tickerPos = 0;
let tickerUnitWidth = 0;
let tickerLastTs = null;
const TICKER_SPEED_PX_S = 70;

function buildTickerSegments(data){
  const segs = [];
  let n = 0;
  for(const [source, arr] of Object.entries(data.news || {})){
    (arr||[]).slice(0,3).forEach(i => {
      const raw = i.title_ar || i.title;
      const { title, source: outlet } = splitTitleSource(raw);
      const flags = detectGulfFlags(source, raw);
      const flagHtml = flags.length ? `<span class="ticker-flags">${flags.map(f=>`<span>${f}</span>`).join('')}</span>` : '';
      const prefix = n < 2 ? '🔴 عاجل — ' : '📰 ';
      const sourceHtml = outlet ? `<span class="ticker-source">${escapeHtml(outlet)}</span>` : '';
      segs.push(`${flagHtml}<span class="ticker-col"><span class="ticker-title">${prefix}${escapeHtml(title)}</span>${sourceHtml}</span>`);
      n++;
    });
  }
  for(const [label, val] of Object.entries(data.markets || {})){
    if(label === 'crypto'){
      for(const [coin, p] of Object.entries(val || {})){
        segs.push(`<span class="ticker-title">💰 ${escapeHtml(CRYPTO_LABELS[coin] || coin)}: $${(p.usd||0).toLocaleString('en-US')}</span>`);
      }
    } else {
      segs.push(`<span class="ticker-title">💹 ${escapeHtml(MARKET_LABELS[label] || label)}: ${escapeHtml(String(val))}</span>`);
    }
  }
  for(const [city, w] of Object.entries(data.weather || {})){
    if(w.temperature_2m === undefined) continue;
    const info = WEATHER_CITY_LABELS[city] || { name:city, flag:'' };
    segs.push(`<span class="ticker-title">${info.flag} ${escapeHtml(info.name)}: ${Math.round(w.temperature_2m)}°م</span>`);
  }
  for(const [ap, count] of Object.entries(data.flights || {})){
    segs.push(`<span class="ticker-title">✈️ ${escapeHtml(FLIGHT_LABELS[ap] || ap)}: ${count} رحلة نشطة</span>`);
  }
  return segs;
}

function stepTicker(ts){
  const track = document.getElementById('ticker');
  if(tickerLastTs === null) tickerLastTs = ts;
  const dt = (ts - tickerLastTs) / 1000;
  tickerLastTs = ts;
  tickerPos -= TICKER_SPEED_PX_S * dt;
  if(tickerUnitWidth > 0 && tickerPos <= -tickerUnitWidth){
    tickerPos += tickerUnitWidth;
  }
  track.style.transform = `translateX(${tickerPos}px)`;
  tickerRAF = requestAnimationFrame(stepTicker);
}

function renderTicker(data){
  const parts = buildTickerSegments(data);
  const hash = JSON.stringify(parts);
  const isNew = hash !== lastTickerHash;
  lastTickerHash = hash;
  if(!isNew) return;

  const wrap = document.querySelector('.ticker-wrap');
  const track = document.getElementById('ticker');
  const unitHTML = parts.length
    ? parts.map(p => `<span>${p}</span>`).join('')
    : '<span><span class="ticker-title">لا توجد بيانات بعد…</span></span>';

  cancelAnimationFrame(tickerRAF);
  track.style.transform = 'translateX(0)';
  track.innerHTML = unitHTML;
  tickerUnitWidth = track.scrollWidth || 1;

  const containerWidth = wrap.clientWidth || window.innerWidth;
  const repeats = Math.max(2, Math.ceil((containerWidth * 2) / tickerUnitWidth) + 1);
  track.innerHTML = unitHTML.repeat(repeats);

  tickerPos = 0;
  tickerLastTs = null;
  tickerRAF = requestAnimationFrame(stepTicker);

  beep({freq:880, duration:0.09, volume:0.035});
  beep({freq:1175, duration:0.09, volume:0.03, delay:0.09});
}

/* ===================== تحميل البيانات ===================== */
async function loadData(){
  try{
    const res = await fetch('data.json?_=' + Date.now());
    const data = await res.json();
    lastData = data;
    renderNews(data.news || {});
    refreshPopup(data);
    renderTicker(data);
    document.getElementById('updatedText').textContent =
      'آخر تحديث: ' + new Intl.DateTimeFormat('ar', {numberingSystem:'latn', dateStyle:'short', timeStyle:'medium'}).format(new Date(data.generated_at_utc));
    renderHealth(data._meta);
  }catch(e){
    console.error('تعذّر تحميل data.json', e);
    const dot = document.getElementById('healthDot');
    dot.className = 'health-dot err';
    dot.title = 'تعذّر تحميل data.json في المتصفح: ' + e.message;
  }
}

function renderHealth(meta){
  const dot = document.getElementById('healthDot');
  if(!meta){ dot.className = 'health-dot'; dot.title = 'لا توجد معلومات تشخيصية'; return; }
  const errors = meta.errors || [];
  if(errors.length === 0){
    dot.className = 'health-dot';
    dot.title = 'كل المصادر تعمل بشكل طبيعي ✅';
  } else {
    const failedSources = Object.entries(meta.status || {}).filter(([,ok]) => !ok).map(([s]) => s);
    const allDown = failedSources.length > 0 && Object.values(meta.status || {}).every(v => !v);
    dot.className = 'health-dot ' + (allDown ? 'err' : 'warn');
    dot.title = 'مصادر متعطلة: ' + errors.map(e => `${e.source} (${e.stage}): ${e.error}`).join(' | ');
  }
}

loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
